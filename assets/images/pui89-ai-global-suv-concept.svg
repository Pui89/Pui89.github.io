 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a8d5e8" stop-opacity=".72"/><stop offset=".35" stop-color="#244a65" stop-opacity=".9"/><stop offset="1" stop-color="#071521"/></linearGradient>
