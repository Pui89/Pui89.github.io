<text x="76" y="82" fill="#39D6F2" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">PUI89 • SHARED AI CORE</text><text x="76" y="154" fill="#F5F8FF" font-family="Arial,sans-serif" font-size="54" font-weight="700">PUI89 AI ROBOT CAR</text><text x="78" y="194" fill="#B8C7D9" font-family="Arial,sans-serif" font-size="23">Vehicle intelligence • environmental awareness • driver assistance</text>
