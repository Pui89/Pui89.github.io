<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PUI89 AI Robot Car — vehicle intelligence concept</title><desc id="desc">Abstract vehicle intelligence and road-awareness architecture. Vehicle body style, dimensions, platform and powertrain are not selected. Advisory-only AI with human driver authority.</desc>
