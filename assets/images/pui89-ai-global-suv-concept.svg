 <circle cx="438" cy="548" r="83"/><circle cx="941" cy="548" r="83"/>
</g>
<g fill="#1a3044" stroke="#b3c5d0" stroke-width="5">
 <circle cx="438" cy="548" r="57"/><circle cx="941" cy="548" r="57"/>
</g>
<g stroke="#91aabd" stroke-width="8" stroke-linecap="round">
 <path d="M438 497 V599 M387 548 H489 M402 512 L474 584 M474 512 L402 584"/>
 <path d="M941 497 V599 M890 548 H992 M905 512 L977 584 M977 512 L905 584"/>
</g>
<g fill="#b9cad5"><circle cx="438" cy="548" r="15"/><circle cx="941" cy="548" r="15"/></g>
<!-- mirrors, roof rails, handles -->
<path d="M420 320 L466 309 L488 325 L460 340Z" fill="#152c42" stroke="#9bb5c5" stroke-width="3"/>
<path d="M570 183 L850 180" stroke="#c3d3dd" stroke-width="5" opacity=".6"/>
<path d="M670 382 L744 382 M868 390 L934 392" stroke="#d3e2eb" stroke-width="5" stroke-linecap="round" opacity=".6"/>
<text x="78" y="86" fill="#f2f8ff" font-family="Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="8">PUI89</text>
<path d="M80 104 H230" stroke="#42d9ff" stroke-width="4"/>
<text x="78" y="158" fill="#f3f7ff" font-family="Arial,sans-serif" font-size="43" font-weight="800" letter-spacing="2">AI GLOBAL SUV</text>
<text x="82" y="190" fill="#a9c2d2" font-family="Arial,sans-serif" font-size="17" letter-spacing="4">CONCEPT 01 · MEDIUM-SIZE · 5 SEATS</text>
<text x="78" y="698" fill="#d8e9f5" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">HEV-FIRST · POWERTRAIN-NEUTRAL AI CORE</text>
<text x="1360" y="698" text-anchor="end" fill="#42d9ff" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">ILLUSTRATIVE CONCEPT ONLY</text>
</svg>