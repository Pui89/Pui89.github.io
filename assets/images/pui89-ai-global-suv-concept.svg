<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PUI89 AI Global SUV — concept illustration</title>
<desc id="desc">A medium-size five-door Deep Navy SUV concept with Electric Cyan accents, shown in a dramatic three-quarter front view on a dark studio background. Concept artwork only; no production specifications or validated capabilities are implied.</desc>
