<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PUI89 AI Global SUV — original medium-size five-door SUV design study</title>
<desc id="desc">A distinct, upright five-door global SUV with high ground clearance, tall cabin, roof rails, muscular wheel arches and a deep navy body with restrained electric-cyan lighting. Advisory intelligence is shown as subtle interface motifs. Concept artwork only; not a production vehicle.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#102a43"/><stop offset=".52" stop-color="#071321"/><stop offset="1" stop-color="#030811"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#1685a6" stop-opacity=".34"/><stop offset="1" stop-color="#071321" stop-opacity="0"/></radialGradient>
 <linearGradient id="paint" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#7794aa"/><stop offset=".2" stop-color="#294963"/><stop offset=".58" stop-color="#10263c"/><stop offset=".82" stop-color="#203b54"/><stop offset="1" stop-color="#071321"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#9bc7d9"/><stop offset=".24" stop-color="#31536b"/><stop offset="1" stop-color="#091827"/></linearGradient>
 <linearGradient id="cyan"><stop stop-color="#24bce9"/><stop offset=".5" stop-color="#b8f7ff"/><stop offset="1" stop-color="#24bce9"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#172c40"/><stop offset="1" stop-color="#02060b"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="32"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="mesh" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#42d9ff" stroke-opacity=".055"/></pattern>
</defs>
