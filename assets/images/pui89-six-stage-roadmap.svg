<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">PUI89 six-stage growth roadmap</title><desc id="desc">Six sequential targets: foundation, product validation, legal and IP readiness, pilot and revenue, team and investment readiness, and international scale.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172a42"/><stop offset="1" stop-color="#0b1220"/></linearGradient></defs><rect width="1200" height="430" rx="28" fill="url(#bg)"/>
<path d="M110 175 H1090" stroke="#49647d" stroke-width="5" stroke-linecap="round"/>
<g font-family="system-ui,sans-serif" text-anchor="middle">
<g fill="#14263b" stroke="#9bd4c5" stroke-width="3"><circle cx="110" cy="175" r="34"/><circle cx="306" cy="175" r="34"/><circle cx="502" cy="175" r="34"/><circle cx="698" cy="175" r="34"/><circle cx="894" cy="175" r="34"/><circle cx="1090" cy="175" r="34"/></g>
<g fill="#f2c879" font-size="22" font-weight="800"><text x="110" y="183">01</text><text x="306" y="183">02</text><text x="502" y="183">03</text><text x="698" y="183">04</text><text x="894" y="183">05</text><text x="1090" y="183">06</text></g>
<g fill="#eef4ff" font-size="18" font-weight="750"><text x="110" y="245">Foundation</text><text x="306" y="245">Validate</text><text x="502" y="245">Legal &amp; IP</text><text x="698" y="245">Pilot</text><text x="894" y="245">Team &amp; capital</text><text x="1090" y="245">Scale</text></g>
<g fill="#afbdd1" font-size="13"><text x="110" y="278">Shared core</text><text x="110" y="297">and tests</text><text x="306" y="278">Data and</text><text x="306" y="297">benchmarks</text><text x="502" y="278">Ownership</text><text x="502" y="297">and structure</text><text x="698" y="278">Controlled</text><text x="698" y="297">field trial</text><text x="894" y="278">Roles and</text><text x="894" y="297">funding plan</text><text x="1090" y="278">Partners and</text><text x="1090" y="297">markets</text></g>
</g><text x="600" y="375" fill="#9bd4c5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">Milestones are future targets — progression depends on evidence, safety and resources.</text></svg>