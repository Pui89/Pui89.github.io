<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">PUI89 EASYRIDE AI AI workflow</title><desc id="desc">EasyRide workflow: road sensing, context perception, warnings and human rider control.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#0C1B2D"/></linearGradient></defs><rect width="1440" height="820" rx="28" fill="url(#bg)"/><path d="M56 176 H1384" stroke="#29445E" stroke-width="2"/><text x="56" y="76" fill="#42D9FF" font-size="17" font-weight="800" letter-spacing="4">PUI89 / TECHNICAL VISUALS</text><text x="56" y="132" fill="#F3F7FF" font-size="39" font-weight="850">PUI89 EASYRIDE AI</text><text x="58" y="160" fill="#B8C7DA" font-size="16" letter-spacing="2">STEP-THROUGH SCOOTER • RIDER-ASSIST INTELLIGENCE</text><text x="56" y="220" fill="#B8F2FF" font-size="16" font-weight="800">AI CAPABILITY LAYERS</text><rect x="56" y="250" width="400" height="210" rx="22" fill="#10243A" stroke="#29445E"/><text x="82" y="292" fill="#42D9FF" font-size="16" font-weight="800">01 / OBSERVE</text><text x="82" y="340" fill="#F3F7FF" font-size="25" font-weight="750">Rider-side sensors</text><text x="82" y="382" fill="#B8C7DA" font-size="17">Front/rear RGB • IMU • GNSS</text><rect x="494" y="250" width="400" height="210" rx="22" fill="#10243A" stroke="#29445E"/><text x="520" y="292" fill="#42D9FF" font-size="16" font-weight="800">02 / PERCEIVE</text><text x="520" y="340" fill="#F3F7FF" font-size="25" font-weight="750">Road context</text><text x="520" y="382" fill="#B8C7DA" font-size="17">Obstacle • weather • battery</text><rect x="932" y="250" width="400" height="210" rx="22" fill="#10243A" stroke="#29445E"/><text x="958" y="292" fill="#42D9FF" font-size="16" font-weight="800">03 / ASSIST</text><text x="958" y="340" fill="#F3F7FF" font-size="25" font-weight="750">Timely rider alerts</text><text x="958" y="382" fill="#B8C7DA" font-size="17">Explain • warn • no actuation</text><text x="56" y="530" fill="#B8F2FF" font-size="16" font-weight="800">END-TO-END TASK FLOW</text><rect x="58" y="570" width="232" height="104" rx="16" fill="#122B43" stroke="#36546D"/><circle cx="83" cy="596" r="13" fill="#42D9FF"/><text x="83" y="601" fill="#07111F" text-anchor="middle" font-size="12" font-weight="900">1</text><text x="174" y="632" fill="#F3F7FF" text-anchor="middle" font-size="17" font-weight="700">Observe road</text><path d="M296 622 h26 l-8 -7 m8 7 l-8 7" fill="none" stroke="#42D9FF" stroke-width="3"/><rect x="328" y="570" width="232" height="104" rx="16" fill="#122B43" stroke="#36546D"/><circle cx="353" cy="596" r="13" fill="#42D9FF"/><text x="353" y="601" fill="#07111F" text-anchor="middle" font-size="12" font-weight="900">2</text><text x="444" y="632" fill="#F3F7FF" text-anchor="middle" font-size="17" font-weight="700">Check sensors</text><path d="M566 622 h26 l-8 -7 m8 7 l-8 7" fill="none" stroke="#42D9FF" stroke-width="3"/><rect x="598" y="570" width="232" height="104" rx="16" fill="#122B43" stroke="#36546D"/><circle cx="623" cy="596" r="13" fill="#42D9FF"/><text x="623" y="601" fill="#07111F" text-anchor="middle" font-size="12" font-weight="900">3</text><text x="714" y="632" fill="#F3F7FF" text-anchor="middle" font-size="17" font-weight="700">Assess context</text><path d="M836 622 h26 l-8 -7 m8 7 l-8 7" fill="none" stroke="#42D9FF" stroke-width="3"/><rect x="868" y="570" width="232" height="104" rx="16" fill="#122B43" stroke="#36546D"/><circle cx="893" cy="596" r="13" fill="#42D9FF"/><text x="893" y="601" fill="#07111F" text-anchor="middle" font-size="12" font-weight="900">4</text><text x="984" y="632" fill="#F3F7FF" text-anchor="middle" font-size="17" font-weight="700">Issue warning</text><path d="M1106 622 h26 l-8 -7 m8 7 l-8 7" fill="none" stroke="#42D9FF" stroke-width="3"/><rect x="1138" y="570" width="232" height="104" rx="16" fill="#122B43" stroke="#36546D"/><circle cx="1163" cy="596" r="13" fill="#42D9FF"/><text x="1163" y="601" fill="#07111F" text-anchor="middle" font-size="12" font-weight="900">5</text><text x="1254" y="632" fill="#F3F7FF" text-anchor="middle" font-size="17" font-weight="700">Rider controls</text><rect x="56" y="716" width="1328" height="70" rx="14" fill="#172A3E" stroke="#8B6D39"/><circle cx="82" cy="751" r="7" fill="#F1C778"/><text x="104" y="746" fill="#F1DCA9" font-size="15" font-weight="800">EVIDENCE BOUNDARY</text><text x="104" y="770" fill="#D4DDE8" font-size="15">Proposed rider-assistance workflow. No autonomous steering, throttle or braking; roadworthiness and rider-safety performance are not validated.</text></svg>