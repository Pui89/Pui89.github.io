<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Sentinel multimodal screening concept</title>
<desc id="desc">A proposed human-supervised screening station with an imaging portal, conveyor, sensor modules and operator review display. Concept illustration only; no validated detection capability is implied.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142c45"/><stop offset="1" stop-color="#07111f"/></linearGradient>
 <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#f4f8fc"/><stop offset=".5" stop-color="#91a9bd"/><stop offset="1" stop-color="#506d86"/></linearGradient>
 <linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#b8f2ff"/><stop offset=".5" stop-color="#42d9ff"/><stop offset="1" stop-color="#087ca8"/></linearGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#6d91ac" stroke-opacity=".12"/></pattern>
</defs>
<rect width="1200" height="760" fill="url(#bg)"/><rect width="1200" height="760" fill="url(#grid)"/>
<ellipse cx="550" cy="380" rx="510" ry="330" fill="#1c6b8b" opacity=".14"/>
<!-- scanner portal -->
<path d="M170 535V160Q170 110 225 110H690Q745 110 745 165V535" fill="#0b1b2b" stroke="url(#metal)" stroke-width="24"/>
<path d="M215 495V185Q215 155 248 155H666Q700 155 700 188V495" fill="#0e2b42" stroke="#42d9ff" stroke-width="7"/>
<path d="M258 200H658V458H258Z" fill="#071522" stroke="#66869f" stroke-width="4"/>
<path d="M290 230H625V425H290Z" fill="#102c43" stroke="#42d9ff" stroke-opacity=".5" stroke-width="3"/>
<path d="M330 325H585" stroke="#42d9ff" stroke-width="4" stroke-dasharray="10 12" opacity=".7"/>
<!-- conveyor -->
<path d="M80 540H850L930 605H150Z" fill="#132c43" stroke="#9bb0c1" stroke-width="7"/>
<path d="M110 558H835" stroke="#42d9ff" stroke-width="7" stroke-linecap="round"/>
<g fill="#071522" stroke="#718ba0" stroke-width="5"><circle cx="190" cy="612" r="22"/><circle cx="780" cy="612" r="22"/></g>
<!-- parcel -->
<path d="M375 425L505 395L610 430L480 465Z" fill="#9bb1c4" stroke="#e4edf5" stroke-width="4"/>
<path d="M375 425V490L480 530V465Z" fill="#506d86" stroke="#9bb1c4" stroke-width="4"/>
<path d="M480 465L610 430V495L480 530Z" fill="#243f59" stroke="#9bb1c4" stroke-width="4"/>
<path d="M480 465V530" stroke="#42d9ff" stroke-width="4"/>
<!-- side sensing modules -->
<g transform="translate(780 215)">
 <rect width="145" height="250" rx="20" fill="#10263b" stroke="#66869f" stroke-width="5"/>
 <rect x="20" y="24" width="105" height="54" rx="10" fill="#071522" stroke="#42d9ff" stroke-width="3"/>
 <circle cx="72" cy="51" r="14" fill="url(#cyan)"/>
 <rect x="20" y="100" width="105" height="45" rx="8" fill="#0b1c2c" stroke="#66869f" stroke-width="3"/>
 <path d="M35 122H110" stroke="#42d9ff" stroke-width="4"/>
 <rect x="20" y="166" width="105" height="54" rx="8" fill="#0b1c2c" stroke="#66869f" stroke-width="3"/>
 <path d="M37 194H107M72 178V210" stroke="#42d9ff" stroke-width="3"/>
</g>
<!-- human review console -->
<g transform="translate(935 250)">
 <rect width="205" height="170" rx="16" fill="#102b42" stroke="#66869f" stroke-width="5"/>
 <rect x="17" y="17" width="171" height="115" rx="8" fill="#061522" stroke="#42d9ff" stroke-width="3"/>
 <path d="M35 48H168M35 68H148M35 88H160" stroke="#42d9ff" stroke-width="4" stroke-linecap="round" opacity=".8"/>
 <path d="M70 170V205H135V170" fill="none" stroke="#91a9bd" stroke-width="12"/>
</g>
<g font-family="Arial,sans-serif" fill="#f3f7ff">
 <text x="100" y="75" font-size="22" font-weight="700" letter-spacing="3">PUI89 SENTINEL</text>
 <text x="100" y="710" font-size="18" fill="#b8c7da" letter-spacing="2">RGB · X-RAY · CHEMICAL INPUTS  /  HUMAN REVIEW</text>
</g>
<g fill="#42d9ff"><circle cx="745" cy="150" r="8"/><circle cx="920" cy="230" r="8"/></g>
</svg>