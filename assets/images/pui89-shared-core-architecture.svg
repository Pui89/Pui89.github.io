<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1220" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Shared AI Core — Five Shared Engineering Pillars</title>
<desc id="desc">A proposed software architecture for six PUI89 projects: Perception and Task Intelligence; Multimodal AI and Sensor Fusion; heterogeneous CPU, GPU, NPU and MCU coordination; Simulation and Digital Twin; and Reliability, Safety and Evidence. Shared contracts connect the foundation to six independent project adapters.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10243b"/><stop offset="1" stop-color="#050d18"/></linearGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#39cfff"/><stop offset="1" stop-color="#a4f0ff"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#183451"/><stop offset="1" stop-color="#10243a"/></linearGradient>
  <style>
    .txt{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf6ff}
    .muted{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#afc3d8}
    .cyan{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#55dcff}
    .card{fill:url(#panel);stroke:#315779;stroke-width:1.6}
    .head{font-size:20px;font-weight:800}
    .sub{font-size:15px}
    .small{font-size:13px}
    .num{font-size:15px;font-weight:850;letter-spacing:1.6px}
  </style>
</defs>
<rect width="1440" height="1220" rx="28" fill="url(#bg)"/>
<g stroke="#25435e" opacity=".22"><path d="M0 140H1440M0 280H1440M0 420H1440M0 560H1440M0 700H1440M0 840H1440M0 980H1440M0 1120H1440"/><path d="M120 0V1220M240 0V1220M360 0V1220M480 0V1220M600 0V1220M720 0V1220M840 0V1220M960 0V1220M1080 0V1220M1200 0V1220M1320 0V1220"/></g>
<text x="64" y="66" class="cyan" font-size="17" font-weight="800" letter-spacing="4">PUI89 / SHARED ENGINEERING FOUNDATION</text>
<text x="64" y="124" class="txt" font-size="48" font-weight="850">SHARED AI CORE</text>
<text x="66" y="160" class="muted" font-size="20">One reusable software foundation · Six independent products</text>
<rect x="1110" y="54" width="266" height="44" rx="22" fill="#332b1d" stroke="#8b7445"/>
<text x="1243" y="81" text-anchor="middle" fill="#f4d99e" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">PROPOSED ARCHITECTURE</text>
<text x="64" y="220" class="cyan num">FIVE SHARED ENGINEERING PILLARS</text>

<g>
 <rect class="card" x="64" y="250" width="410" height="230" rx="18"/>
 <text x="92" y="288" class="cyan num">01 / INTELLIGENCE</text>
 <text x="92" y="326" class="txt head">Perception &amp; Task Intelligence</text>
 <text x="92" y="365" class="muted sub">Observe · Perceive · Assess</text>
 <text x="92" y="392" class="muted sub">Decide · Respond · Learn from Evidence</text>
 <text x="92" y="435" class="txt small">Detection, classification, tracking, segmentation,</text>
 <text x="92" y="457" class="txt small">scene understanding, task context and uncertainty.</text>

 <rect class="card" x="515" y="250" width="410" height="230" rx="18"/>
 <text x="543" y="288" class="cyan num">02 / SENSING</text>
 <text x="543" y="326" class="txt head">Multimodal AI &amp; Sensor Fusion</text>
 <text x="543" y="365" class="muted sub">RGB · Depth · Thermal · NIR · LiDAR</text>
 <text x="543" y="392" class="muted sub">Audio · IMU · GNSS · Other approved inputs</text>
 <text x="543" y="435" class="txt small">Time alignment, calibration, data quality,</text>
 <text x="543" y="457" class="txt small">cross-modal context and disagreement checks.</text>

 <rect class="card" x="966" y="250" width="410" height="230" rx="18"/>
 <text x="994" y="288" class="cyan num">03 / COMPUTE</text>
 <text x="994" y="326" class="txt head">Heterogeneous Compute Coordination</text>
 <text x="994" y="365" class="muted sub">CPU · GPU · NPU · MCU · Memory</text>
 <text x="994" y="392" class="muted sub">Sensors · Power · Thermal constraints</text>
 <text x="994" y="435" class="txt small">Workload placement, model sizing, quantization,</text>
 <text x="994" y="457" class="txt small">resource-aware scheduling and graceful fallback.</text>

 <rect class="card" x="288" y="510" width="410" height="220" rx="18"/>
 <text x="316" y="548" class="cyan num">04 / ENGINEERING</text>
 <text x="316" y="586" class="txt head">Simulation &amp; Digital Twin</text>
 <text x="316" y="625" class="muted sub">Simulate → Validate → Prototype</text>
 <text x="316" y="652" class="muted sub">→ Supervised real-world testing</text>
 <text x="316" y="695" class="txt small">Process, route, robot and system scenarios;</text>
 <text x="316" y="717" class="txt small">simulation results remain distinct from field evidence.</text>

 <rect class="card" x="741" y="510" width="410" height="220" rx="18"/>
 <text x="769" y="548" class="cyan num">05 / TRUST</text>
 <text x="769" y="586" class="txt head">Reliability, Safety &amp; Evidence</text>
 <text x="769" y="625" class="muted sub">Provenance · Tests · Fault reporting</text>
 <text x="769" y="652" class="muted sub">Uncertainty · Human review · Safe hold</text>
 <text x="769" y="695" class="txt small">Independent safety gates, abstention, audit trails,</text>
 <text x="769" y="717" class="txt small">fault injection and regression evidence.</text>
</g>

<path d="M269 480V494H720V500M720 480V500M1171 480V494H720" fill="none" stroke="#54dfff" stroke-width="2" opacity=".65"/>
<path d="M493 730V760H720M946 730V760H720V785" fill="none" stroke="#54dfff" stroke-width="2" opacity=".7"/>
<rect x="64" y="785" width="1312" height="120" rx="18" fill="#0d1d2e" stroke="#3b7898" stroke-width="1.8"/>
<text x="92" y="824" class="cyan num">SHARED DATA CONTRACTS &amp; INTERFACES</text>
<text x="92" y="864" class="txt" font-size="18" font-weight="750">Observation</text>
<text x="330" y="864" class="txt" font-size="18" font-weight="750">WorldState</text>
<text x="550" y="864" class="txt" font-size="18" font-weight="750">ActionProposal</text>
<text x="830" y="864" class="txt" font-size="18" font-weight="750">FailureReport</text>
<text x="1070" y="864" class="txt" font-size="18" font-weight="750">Evidence Passport</text>
<path d="M720 905V938" stroke="#54dfff" stroke-width="2.5"/>
<path d="M710 928L720 940L730 928" fill="none" stroke="#54dfff" stroke-width="2.5"/>
<text x="64" y="980" class="cyan num">SIX PRODUCT-SPECIFIC ADAPTERS</text>
<g>
 <rect x="64" y="1000" width="206" height="88" rx="12" class="card"/><text x="167" y="1036" text-anchor="middle" class="txt" font-size="15" font-weight="800">COCONUT</text><text x="167" y="1060" text-anchor="middle" class="muted small">Harvest AI</text>
 <rect x="282" y="1000" width="206" height="88" rx="12" class="card"/><text x="385" y="1036" text-anchor="middle" class="txt" font-size="15" font-weight="800">SENTINEL</text><text x="385" y="1060" text-anchor="middle" class="muted small">Inspection robot</text>
 <rect x="500" y="1000" width="206" height="88" rx="12" class="card"/><text x="603" y="1036" text-anchor="middle" class="txt" font-size="15" font-weight="800">AI HOME</text><text x="603" y="1060" text-anchor="middle" class="muted small">Indoor assistant</text>
 <rect x="718" y="1000" width="206" height="88" rx="12" class="card"/><text x="821" y="1036" text-anchor="middle" class="txt" font-size="15" font-weight="800">AI NOMAD</text><text x="821" y="1060" text-anchor="middle" class="muted small">Mobile assistant</text>
 <rect x="936" y="1000" width="206" height="88" rx="12" class="card"/><text x="1039" y="1036" text-anchor="middle" class="txt" font-size="15" font-weight="800">AI GLOBAL SUV</text><text x="1039" y="1060" text-anchor="middle" class="muted small">Intelligent mobility</text>
 <rect x="1154" y="1000" width="206" height="88" rx="12" class="card"/><text x="1257" y="1036" text-anchor="middle" class="txt" font-size="15" font-weight="800">EASYRIDE</text><text x="1257" y="1060" text-anchor="middle" class="muted small">AI step-through</text>
</g>
<text x="64" y="1145" class="muted" font-size="14">Software-first · Modular · Open-source-first · Human-supervised · Evidence before claims</text>
<text x="64" y="1175" fill="#8fa7bd" font-size="12" font-family="Inter,Segoe UI,Arial,sans-serif">Conceptual architecture only. Integration, compute performance, simulation fidelity and physical safety require separate tests and evidence.</text>
</svg>