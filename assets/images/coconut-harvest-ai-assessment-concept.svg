 <linearGradient id="skin" x2="0" y2="1"><stop stop-color="#d9a77e"/><stop offset="1" stop-color="#a96d4f"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8cecff" stroke-opacity=".08"/></pattern>
