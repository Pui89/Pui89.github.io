<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Coconut Harvest AI — orchard image assessment concept</title>
<desc id="desc">A Thai coconut orchard with an operator reviewing four coconut appearance categories on a tablet. Concept illustration for a software-first, human-reviewed AI assessment workflow; no harvesting robot is depicted.</desc>
<defs>
