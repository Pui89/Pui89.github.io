 <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#6f8c54"/><stop offset="1" stop-color="#243f35"/></linearGradient>
 <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#142d45"/><stop offset="1" stop-color="#091827"/></linearGradient>
