<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">PUI89 AI NOMAD — suitcase-style four-wheel mobile assistant</title>
<desc id="desc">Original concept illustration of a compact upright suitcase-shaped mobile assistant with a telescopic pull handle, four wheels, a front sensor panel and Deep Navy, Titanium Silver and Electric Cyan details. Concept only; not a built or validated product.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#071426"/></linearGradient>
 <linearGradient id="case" x2="1" y2="1"><stop stop-color="#f5f7fa"/><stop offset=".48" stop-color="#b9c5d2"/><stop offset="1" stop-color="#718399"/></linearGradient>
 <linearGradient id="side" x2="1"><stop stop-color="#53677d"/><stop offset="1" stop-color="#263b52"/></linearGradient>
 <linearGradient id="cyan" x2="1"><stop stop-color="#67e8ff"/><stop offset="1" stop-color="#08a9df"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/>
<circle cx="900" cy="170" r="210" fill="#0f52ba" opacity=".12"/>
<path d="M0 620Q300 565 600 620T1200 600V760H0Z" fill="#0b1b2c"/>
<ellipse cx="600" cy="640" rx="270" ry="34" fill="#000" opacity=".48" filter="url(#shadow)"/>
<g opacity=".38" stroke="#31506b" fill="none"><path d="M90 670H1110"/><path d="M140 700H1060"/></g>
<!-- telescopic handle -->
<path d="M505 250V130Q505 105 530 105H670Q695 105 695 130V250" fill="none" stroke="#53677d" stroke-width="28" stroke-linecap="round"/>
<path d="M505 250V130Q505 105 530 105H670Q695 105 695 130V250" fill="none" stroke="#e8edf2" stroke-width="15" stroke-linecap="round"/>
<path d="M530 105H670" stroke="url(#cyan)" stroke-width="9" stroke-linecap="round"/>
<!-- suitcase body -->
<rect x="355" y="235" width="490" height="355" rx="58" fill="url(#side)" stroke="#dbe4ed" stroke-width="5"/>
<rect x="375" y="250" width="450" height="325" rx="45" fill="url(#case)" stroke="#f7f9fb" stroke-width="4"/>
<path d="M405 282Q600 255 795 282" fill="none" stroke="#fff" stroke-width="7" opacity=".45"/>
<path d="M410 310V520" stroke="#718399" stroke-width="4" opacity=".55"/>
<path d="M790 310V520" stroke="#718399" stroke-width="4" opacity=".55"/>
<!-- front sensor/display panel -->
<rect x="485" y="375" width="230" height="92" rx="24" fill="#071426" stroke="#284b68" stroke-width="4"/>
<rect x="508" y="395" width="184" height="52" rx="14" fill="#0b2035"/>
<circle cx="555" cy="421" r="12" fill="url(#cyan)" filter="url(#glow)"/>
<circle cx="645" cy="421" r="12" fill="url(#cyan)" filter="url(#glow)"/>
<path d="M582 421H618" stroke="#67e8ff" stroke-width="4" stroke-linecap="round"/>
<path d="M440 535H760" stroke="#0f52ba" stroke-width="8" stroke-linecap="round"/>
<!-- four wheels: two visible front, two rear indicated -->
<g>
 <rect x="390" y="560" width="68" height="82" rx="26" fill="#101d2b" stroke="#6d8298" stroke-width="5"/>
 <rect x="742" y="560" width="68" height="82" rx="26" fill="#101d2b" stroke="#6d8298" stroke-width="5"/>
 <rect x="405" y="575" width="38" height="52" rx="18" fill="#344a60"/>
 <rect x="757" y="575" width="38" height="52" rx="18" fill="#344a60"/>
 <circle cx="424" cy="601" r="8" fill="#67e8ff"/>
 <circle cx="776" cy="601" r="8" fill="#67e8ff"/>
 <rect x="330" y="520" width="42" height="66" rx="18" fill="#101d2b" stroke="#6d8298" stroke-width="4"/>
 <rect x="828" y="520" width="42" height="66" rx="18" fill="#101d2b" stroke="#6d8298" stroke-width="4"/>
</g>
<text x="600" y="710" fill="#aebfd1" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" letter-spacing="4">PUI89 AI NOMAD · FOUR-WHEEL MOBILE ASSISTANT</text>
</svg>