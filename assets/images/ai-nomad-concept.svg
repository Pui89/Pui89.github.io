<title id="title">PUI89 AI NOMAD — suitcase-style four-wheel mobile assistant</title>
<desc id="desc">Original concept illustration of a compact upright suitcase-shaped mobile assistant with a telescopic pull handle, four integrated wheels, discreet front sensors and a Deep Navy body with restrained Electric Cyan details. The understated luggage-like appearance is a design goal. Concept only; not a built or validated product.</desc>
