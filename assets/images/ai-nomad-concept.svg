<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">PUI89 AI NOMAD — upright suitcase-style four-wheel mobile assistant</title>
<desc id="desc">Concept-only illustration of an upright Deep Navy luggage-inspired mobile assistant. It shows a tall narrow enclosure, twin telescopic handle rails, four separately visible integrated caster modules, and a small recessed sensor window with no face-like lights. Safety-critical indicators and required disclosures must remain visible. Not a built or validated product.</desc>
