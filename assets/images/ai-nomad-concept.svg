<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">PUI89 AI NOMAD — compact four-wheel mobile assistant concept</title>
<desc id="desc">Original concept illustration of a compact low-profile four-wheel mobile assistant with a dog-inspired friendly body, integrated pull handle, front sensor panel, four visible wheels, and restrained Deep Navy, Platinum Titanium and Sapphire Blue finishes. Concept only, not a photograph or validated product.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#071426"/></linearGradient>
 <linearGradient id="shell" x2="0.15" y2="1"><stop stop-color="#f4f6f8"/><stop offset=".42" stop-color="#aeb9c7"/><stop offset="1" stop-color="#64758a"/></linearGradient>
 <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#2878e8"/><stop offset="1" stop-color="#0b347d"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#183b59"/><stop offset="1" stop-color="#06111e"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="16"/></filter>
 </defs>
 <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
