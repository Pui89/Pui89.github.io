<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">PUI89 — One shared AI core, three real-world project directions</title>
<desc id="desc">A bilingual overview of PUI89 connecting agriculture, extreme flood rescue and multimodal inspection through a shared evidence-led AI engineering core. All three are concepts in development.</desc>
<defs>
 <linearGradient id="back" x2="1" y2="1"><stop stop-color="#101e31"/><stop offset=".55" stop-color="#0a1727"/><stop offset="1" stop-color="#11172b"/></linearGradient>
 <linearGradient id="core" x2="1" y2="1"><stop stop-color="#1d5360"/><stop offset="1" stop-color="#29395d"/></linearGradient>
 <linearGradient id="green" x2="1" y2="1"><stop stop-color="#b7e7c6"/><stop offset="1" stop-color="#3e9977"/></linearGradient>
 <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#9de0ed"/><stop offset="1" stop-color="#387caa"/></linearGradient>
 <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#ddc6f5"/><stop offset="1" stop-color="#806ab0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1600" height="920" rx="34" fill="url(#back)"/>
<circle cx="800" cy="420" r="260" fill="#73cdbb" opacity=".07" filter="url(#glow)"/>
<g font-family="Arial,'Noto Sans Thai',sans-serif">
 <text x="800" y="78" text-anchor="middle" fill="#a9dfd1" font-size="22" font-weight="700" letter-spacing="8">PUI89 · AI ROBOTICS</text>
 <text x="800" y="137" text-anchor="middle" fill="#f1f6fc" font-size="46" font-weight="700">Intelligence for the real world</text>
 <text x="800" y="178" text-anchor="middle" fill="#b6c8d9" font-size="24">AI เพื่อโลกแห่งความเป็นจริง</text>
 <text x="800" y="220" text-anchor="middle" fill="#9db0c5" font-size="19">One shared engineering core · Three practical project directions</text>
 <text x="800" y="249" text-anchor="middle" fill="#9db0c5" font-size="19">แกนวิศวกรรม AI ร่วมกัน · 3 แนวทางแก้ปัญหาในโลกจริง</text>
 <!-- connector network -->
 <g fill="none" stroke-width="5" opacity=".72">
  <path d="M800 455L285 360" stroke="#8bd2b4"/><path d="M800 455L800 350" stroke="#82c9df"/><path d="M800 455L1315 360" stroke="#c3a6e8"/>
  <path d="M285 360L285 310M800 350L800 310M1315 360L1315 310" stroke="#66859b" stroke-dasharray="8 10"/>
 </g>
 <!-- left project card -->
 <g transform="translate(70 285)">
  <rect width="430" height="280" rx="28" fill="#102b2c" stroke="#5b9d80" stroke-width="2"/>
  <circle cx="215" cy="95" r="74" fill="#b4e7c4" opacity=".1"/>
  <path d="M218 169Q230 95 242 40" stroke="#9b7956" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M242 45Q170 3 112 40Q174 36 224 61Q170 68 145 104Q206 90 241 66Q285 2 344 18Q298 48 257 68Q310 59 352 91Q296 83 255 88" fill="none" stroke="#8bd1a8" stroke-width="12" stroke-linecap="round"/>
  <g fill="#72bc83" stroke="#c3eccb" stroke-width="3"><ellipse cx="231" cy="108" rx="12" ry="19"/><ellipse cx="253" cy="112" rx="12" ry="19"/><ellipse cx="242" cy="133" rx="11" ry="17"/></g>
  <path d="M70 170H360" stroke="#477b68" stroke-width="3"/>
  <text x="215" y="211" text-anchor="middle" fill="#eaf7ed" font-size="27" font-weight="700">01 · AGRICULTURE</text>
  <text x="215" y="244" text-anchor="middle" fill="#b8ddc8" font-size="21">Coconut Harvest AI</text>
  <text x="215" y="270" text-anchor="middle" fill="#91bca7" font-size="17">เกษตรกรรม · AI เก็บเกี่ยวมะพร้าว</text>
 </g>
 <!-- center project -->
 <g transform="translate(585 285)">
  <rect width="430" height="280" rx="28" fill="#10283a" stroke="#528fae" stroke-width="2"/>
  <circle cx="215" cy="100" r="78" fill="#8ed7ec" opacity=".1"/>
  <path d="M62 128Q110 109 155 128T248 128T370 128V174H62Z" fill="#246784"/>
  <path d="M88 133Q105 177 164 184H302Q350 176 367 133L337 118H116Z" fill="#c6e1dc" stroke="#8fcbd5" stroke-width="5"/>
  <rect x="172" y="72" width="100" height="58" rx="15" fill="#315c72" stroke="#c1e5e8" stroke-width="5"/>
  <path d="M219 72V35L235 18L251 35V72" stroke="#c1e5e8" stroke-width="7" fill="none"/>
  <circle cx="235" cy="18" r="10" fill="#9ee2e9"/>
  <g fill="#142a3b" stroke="#b4d9df" stroke-width="6"><circle cx="144" cy="174" r="20"/><circle cx="313" cy="174" r="20"/></g>
  <text x="215" y="211" text-anchor="middle" fill="#e8f6fb" font-size="27" font-weight="700">02 · DISASTER RESPONSE</text>
  <text x="215" y="244" text-anchor="middle" fill="#b5dbe8" font-size="21">Extreme Flood Rescue AI</text>
  <text x="215" y="270" text-anchor="middle" fill="#91bfd0" font-size="17">รับมือภัยพิบัติ · AI กู้ภัยน้ำท่วม</text>
 </g>
 <!-- right project -->
 <g transform="translate(1100 285)">
  <rect width="430" height="280" rx="28" fill="#28233c" stroke="#9d83c6" stroke-width="2"/>
  <circle cx="215" cy="98" r="78" fill="#d1b8f1" opacity=".1"/>
  <path d="M120 95Q215 48 310 94L300 145Q215 172 126 145Z" fill="url(#violet)" stroke="#e5d8f5" stroke-width="5"/>
  <rect x="183" y="73" width="64" height="39" rx="10" fill="#29374e" stroke="#d9c9ee" stroke-width="4"/>
  <circle cx="199" cy="92" r="6" fill="#8ee0df"/><circle cx="231" cy="92" r="6" fill="#8ee0df"/>
  <g stroke="#d4c3eb" stroke-width="15" stroke-linecap="round" fill="none"><path d="M143 140L120 190L98 197"/><path d="M177 151L170 197L151 204"/><path d="M273 148L292 194L314 201"/><path d="M299 135L335 177L354 181"/></g>
  <text x="215" y="211" text-anchor="middle" fill="#f1eafa" font-size="27" font-weight="700">03 · MULTIMODAL INSPECTION</text>
  <text x="215" y="244" text-anchor="middle" fill="#d4c5ec" font-size="21">Multimodal Screening AI</text>
  <text x="215" y="270" text-anchor="middle" fill="#b7a4d5" font-size="17">ตรวจคัดกรองหลายรูปแบบ · AI ตรวจสอบ</text>
 </g>
 <!-- core hub -->
 <g transform="translate(515 610)">
  <rect width="570" height="205" rx="30" fill="url(#core)" stroke="#80c9bb" stroke-width="3"/>
  <text x="285" y="49" text-anchor="middle" fill="#b9ead9" font-size="19" font-weight="700" letter-spacing="4">SHARED PUI89 AI CORE</text>
  <text x="285" y="88" text-anchor="middle" fill="#f1f7fc" font-size="31" font-weight="700">Evidence-led engineering</text>
  <text x="285" y="121" text-anchor="middle" fill="#c1d8e2" font-size="20">วิศวกรรมที่ขับเคลื่อนด้วยหลักฐาน</text>
  <g font-size="17" font-weight="700" text-anchor="middle">
   <rect x="26" y="146" width="112" height="38" rx="12" fill="#24485a"/><text x="82" y="171" fill="#dff5ef">BUILD</text>
   <rect x="154" y="146" width="112" height="38" rx="12" fill="#24485a"/><text x="210" y="171" fill="#dff5ef">TEST</text>
   <rect x="282" y="146" width="112" height="38" rx="12" fill="#24485a"/><text x="338" y="171" fill="#dff5ef">MEASURE</text>
   <rect x="410" y="146" width="134" height="38" rx="12" fill="#24485a"/><text x="477" y="171" fill="#dff5ef">IMPROVE</text>
  </g>
 </g>
 <text x="800" y="865" text-anchor="middle" fill="#d8e3ed" font-size="20" font-weight="700">IN DEVELOPMENT · Concepts and software work — not validated physical robots</text>
 <text x="800" y="893" text-anchor="middle" fill="#9eb1c5" font-size="17">อยู่ระหว่างพัฒนา · เป็นแนวคิดและงานซอฟต์แวร์ ยังไม่ใช่หุ่นยนต์ที่ผ่านการทดสอบยืนยัน</text>
</g></svg>