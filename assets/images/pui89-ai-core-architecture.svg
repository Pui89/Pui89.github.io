<text x="600" y="724" text-anchor="middle" fill="#9bd4c5" font-family="system-ui,sans-serif" font-size="16" font-weight="750">Each project keeps its own mission, requirements, evidence and validation path.</text>
<text x="600" y="758" text-anchor="middle" fill="#c4d5e5" font-family="system-ui,sans-serif" font-size="14">Conceptual architecture only · human review and project-specific safety policies remain mandatory</text>
<text x="600" y="785" text-anchor="middle" fill="#c4d5e5" font-family="system-ui,sans-serif" font-size="14">No physical capability, direct hardware actuation or field validation is implied.</text>
