<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Shared AI Core architecture for all seven independent projects</title>
<desc id="desc">Seven separate project adapters—Coconut Harvest AI, Extreme Flood Rescue AI, PUI89 Sentinel, AI HOME, AI NOMAD, AI Global SUV and AI Step-Through Scooter—connect to reusable shared AI Core interfaces for perception, world state, uncertainty, safety evaluation, simulation-first task proposals and auditable evidence. Each project retains its own requirements, validation gates and safety policy. No direct hardware actuation is shown.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172a42"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
  <linearGradient id="core" x2="1" y2="1"><stop stop-color="#225c62"/><stop offset="1" stop-color="#183c4d"/></linearGradient>
  <linearGradient id="card" x2="1" y2="1"><stop stop-color="#1a3049"/><stop offset="1" stop-color="#112238"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#9bd4c5" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="820" rx="28" fill="url(#bg)"/>
<text x="600" y="42" text-anchor="middle" fill="#9bd4c5" font-family="system-ui,sans-serif" font-size="17" font-weight="750" letter-spacing="2">ONE REUSABLE FOUNDATION · SEVEN INDEPENDENT PROJECTS</text>
<g fill="url(#card)" stroke="#49647d" stroke-width="2">
