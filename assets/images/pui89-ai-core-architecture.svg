  <rect x="40" y="599" width="390" height="70" rx="14"/>
  <rect x="490" y="160" width="330" height="430" rx="24" fill="url(#core)" stroke="#9bd4c5" stroke-width="3"/>
  <rect x="875" y="205" width="285" height="340" rx="22"/>
</g>
<g stroke="#9bd4c5" stroke-width="2.5" fill="none" opacity=".9" marker-end="url(#arrow)">
