<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">PUI89 six-product AI engineering portfolio</title>
<desc id="desc">Six product concepts connected to one shared AI engineering foundation: coconut harvesting, multimodal screening, home assistance, mobile assistance, an AI car and a step-through scooter.</desc>
