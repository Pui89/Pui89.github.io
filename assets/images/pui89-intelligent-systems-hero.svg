<title id="title">PUI89 — Seven non-humanoid AI engineering projects</title>
<desc id="desc">A dark navy isometric engineering portfolio illustration. Seven distinct non-humanoid project concepts surround a central PUI89 identity: Coconut Harvest AI, Flood Rescue AI, PUI89 Sentinel, AI HOME, AI NOMAD, PUI89 Compact Smart EV and AI Robot Motorcycle. Visuals are conceptual and do not imply validated physical systems.</desc>
