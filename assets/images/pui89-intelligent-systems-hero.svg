<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">N PUI89 — Seven intelligent machine concepts</title><desc id="d">Seven non-humanoid AI machine concepts arranged around the N PUI89 identity: coconut harvesting robot, amphibious flood rescue craft, Sentinel inspection rover, AI HOME, AI NOMAD, AI Robot Car and EasyRide AI Motorcycle.</desc>
