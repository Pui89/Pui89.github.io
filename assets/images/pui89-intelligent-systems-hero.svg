 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8cf5ff"/><stop offset=".5" stop-color="#42d9ff"/><stop offset="1" stop-color="#168db8"/></linearGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#1d5872"/><stop offset="1" stop-color="#092238"/></linearGradient>
