<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Symbol 32 — Green N Mark</title>
<desc id="desc">The original symbol 32 direction: a bold angular N-shaped zigzag mark, paired with the PUI89 wordmark, in green on a deep navy background.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111a"/><stop offset="1" stop-color="#172531"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#79e5a3"/><stop offset="1" stop-color="#2ebd72"/></linearGradient></defs>
<rect width="1200" height="900" rx="32" fill="url(#bg)"/>
<path d="M390 250V650L810 250V650" fill="none" stroke="url(#green)" stroke-width="58" stroke-linecap="square" stroke-linejoin="miter"/>
<text x="600" y="770" text-anchor="middle" fill="#f2f5f5" font-family="Arial,sans-serif" font-size="76" font-weight="700" letter-spacing="13">PUI89</text>
<text x="600" y="825" text-anchor="middle" fill="#9aadb8" font-family="Arial,sans-serif" font-size="20" letter-spacing="7">SYMBOL 32</text>
</svg>