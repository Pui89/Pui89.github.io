<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PUI89 — Intelligent systems, responsibly engineered</title>
<desc id="desc">A standalone PUI89 brand visual: a luminous geometric PUI89 monogram formed from precise connected lines and nodes, surrounded by a subtle orbital network. No robots or project-specific machines are depicted.</desc>
<defs>
 <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset=".5" stop-color="#102b3a"/><stop offset="1" stop-color="#071521"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#4cb7b0" stop-opacity=".22"/><stop offset="1" stop-color="#4cb7b0" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3fbff"/><stop offset=".42" stop-color="#a8d9df"/><stop offset="1" stop-color="#65b7b0"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9be7c4"/><stop offset=".5" stop-color="#6bd3d4"/><stop offset="1" stop-color="#8caef2"/></linearGradient>
 <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="fineGrid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#9bd7dc" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#background)"/>
<rect width="1600" height="900" rx="34" fill="url(#fineGrid)"/>
<ellipse cx="800" cy="410" rx="610" ry="390" fill="url(#halo)"/>
<!-- quiet orbital geometry -->
<g fill="none" stroke="#8fd6dc" stroke-opacity=".2">
 <ellipse cx="800" cy="410" rx="560" ry="250" transform="rotate(-18 800 410)" stroke-width="1.5"/>
 <ellipse cx="800" cy="410" rx="500" ry="320" transform="rotate(22 800 410)" stroke-width="1.2" stroke-dasharray="3 12"/>
 <circle cx="800" cy="410" r="300" stroke-dasharray="2 15"/>
</g>
<g fill="#9be7c4" filter="url(#smallGlow)">
 <circle cx="276" cy="260" r="5"/><circle cx="1260" cy="275" r="5"/><circle cx="1190" cy="670" r="4"/><circle cx="385" cy="690" r="4"/><circle cx="800" cy="115" r="4"/>
</g>
<!-- abstract connected intelligence nodes -->
<g stroke="url(#accent)" stroke-opacity=".45" stroke-width="2" fill="none">
 <path d="M276 260L450 330L570 230M1260 275L1110 330L1030 225M385 690L520 585L610 690M1190 670L1080 575L990 690M800 115L800 190"/>
 <path d="M450 330L520 450L385 690M1110 330L1080 450L1190 670" stroke-dasharray="5 9"/>
</g>
<!-- central monogram frame -->
<g filter="url(#softGlow)" opacity=".8"><circle cx="800" cy="405" r="220" fill="none" stroke="#66d6ce" stroke-opacity=".16" stroke-width="2"/><circle cx="800" cy="405" r="194" fill="none" stroke="#9bdfe3" stroke-opacity=".24" stroke-width="1.5" stroke-dasharray="2 12"/></g>
<g fill="none" stroke="url(#metal)" stroke-width="25" stroke-linecap="square" stroke-linejoin="round">
 <!-- abstract P -->
 <path d="M560 510V300H660Q735 300 735 370Q735 440 660 440H560"/>
 <!-- abstract U -->
 <path d="M790 300V435Q790 510 865 510Q940 510 940 435V300"/>
 <!-- abstract I / 89 signal strokes -->
 <path d="M1000 300V510M1000 300H1075M1000 510H1075"/>
</g>
<!-- luminous connection points -->
<g fill="#a9f0d5" filter="url(#smallGlow)"><circle cx="560" cy="300" r="8"/><circle cx="560" cy="510" r="8"/><circle cx="940" cy="435" r="8"/><circle cx="1000" cy="300" r="8"/><circle cx="1000" cy="510" r="8"/></g>
<!-- brand wordmark and positioning -->
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
 <text x="800" y="640" fill="#f3f8fb" font-size="76" font-weight="800" letter-spacing="15">PUI89</text>
 <rect x="620" y="675" width="360" height="3" rx="2" fill="url(#accent)"/>
 <text x="800" y="725" fill="#c2e9e5" font-size="23" font-weight="700" letter-spacing="5">AI · ENGINEERING · INNOVATION</text>
 <text x="800" y="775" fill="#9db6c3" font-size="19" letter-spacing="2">INTELLIGENT SYSTEMS, RESPONSIBLY ENGINEERED</text>
</g>
<g fill="none" stroke="#9bdfe3" stroke-opacity=".35" stroke-width="1.5"><path d="M150 830H500M1100 830H1450"/></g>
<g font-family="Arial" font-size="13" fill="#89a9b7" letter-spacing="3"><text x="150" y="855">PUI89 / INDEPENDENT AI INITIATIVE</text><text x="1450" y="855" text-anchor="end">EST. AS AN EARLY-STAGE CONCEPT</text></g>
</svg>