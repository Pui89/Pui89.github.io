<rect x="70" y="790" width="1460" height="68" rx="14" fill="#0a1a2c" stroke="#304c68"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="98" y="819" fill="#42d9ff" font-size="15" font-weight="700" letter-spacing="2">PUI89 SHARED AI CORE</text>
 <text x="98" y="842" fill="#d5e4f1" font-size="15">Observation → WorldState → Safety Gate → Advisory → Evidence</text>
