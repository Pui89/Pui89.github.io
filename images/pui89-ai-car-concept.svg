 <text x="1258" y="438" fill="#9bb6c9" font-size="13" letter-spacing="1">CAMERA · RADAR · LIDAR*</text>
 <text x="80" y="480">PROXIMITY ZONES</text><text x="80" y="505" fill="#9bb6c9" font-size="13" letter-spacing="1">CONCEPTUAL SENSOR PLACEMENT</text>
 <text x="1430" y="462">FRONT</text><text x="1430" y="484" fill="#9bb6c9" font-size="13">HAZARD AWARENESS</text>
</g>
