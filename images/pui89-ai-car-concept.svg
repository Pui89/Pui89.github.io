<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Compact Smart EV — Vehicle Intelligence Concept</title>
<desc id="desc">A premium futuristic compact electric crossover concept in deep navy and electric cyan, shown from a front three-quarter angle with camera, radar, lidar and proximity sensor zones, driver-assistance intelligence overlays, and simulation-first safety architecture. Concept artwork only, not a built or road-validated vehicle.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101d"/><stop offset=".52" stop-color="#10243b"/><stop offset="1" stop-color="#07111f"/></linearGradient>
 <linearGradient id="paint" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#f4fbff"/><stop offset=".22" stop-color="#a9c4d8"/><stop offset=".52" stop-color="#45657f"/><stop offset="1" stop-color="#172d45"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset=".55" stop-color="#16415b"/><stop offset="1" stop-color="#071522"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42d9ff"/><stop offset="1" stop-color="#a8edbd"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#42d9ff" stop-opacity=".26"/><stop offset="1" stop-color="#42d9ff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="30"/></filter>
 <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#42d9ff" stroke-opacity=".12" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<circle cx="1050" cy="390" r="480" fill="url(#halo)"/>
