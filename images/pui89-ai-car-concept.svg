<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Compact Hybrid Smart Vehicle — Design Concept</title>
<desc id="desc">A compact five-door hybrid-electric smart hatchback concept in deep navy, titanium silver and electric cyan, shown from a front three-quarter view. Concept only; hybrid architecture and vehicle dimensions are not validated.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06101d"/><stop offset=".55" stop-color="#10243b"/><stop offset="1" stop-color="#07111f"/></linearGradient>
 <linearGradient id="body" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f4f8fb"/><stop offset=".28" stop-color="#9db4c7"/><stop offset=".62" stop-color="#536f88"/><stop offset="1" stop-color="#142a41"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#071827"/><stop offset=".5" stop-color="#1c4b65"/><stop offset="1" stop-color="#081827"/></linearGradient>
 <linearGradient id="cyan"><stop stop-color="#42d9ff"/><stop offset="1" stop-color="#a8edbd"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#42d9ff" stop-opacity=".28"/><stop offset="1" stop-color="#42d9ff" stop-opacity="0"/></radialGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="28"/></filter>
 <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#42d9ff" stroke-opacity=".1"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<circle cx="1000" cy="420" r="520" fill="url(#glow)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="82" y="82" fill="#42d9ff" font-size="21" font-weight="700" letter-spacing="7">PUI89 / SMART MOBILITY</text><text x="80" y="158" fill="#f3f7ff" font-size="62" font-weight="800">COMPACT HYBRID</text><text x="84" y="198" fill="#b8c7da" font-size="22" letter-spacing="2">SMART VEHICLE · HUMAN-DRIVER-FIRST</text></g>
<path d="M0 700H1600V900H0Z" fill="#081522"/><path d="M0 755H1600M0 810H1600M0 865H1600" stroke="#42d9ff" stroke-opacity=".13" stroke-width="2"/>
<ellipse cx="820" cy="700" rx="520" ry="62" fill="#000" opacity=".55" filter="url(#shadow)"/>
<!-- compact five-door body -->
<path d="M290 610L330 520Q355 485 450 465L535 365Q575 325 655 320L955 320Q1030 326 1080 390L1165 485L1290 515Q1365 535 1390 600L1375 654Q1320 680 1220 686H390Q300 674 270 645Z" fill="url(#body)" stroke="#d8efff" stroke-opacity=".75" stroke-width="4"/>
<!-- compact upright cabin -->
<path d="M500 460L580 370Q610 338 670 338H944Q1000 340 1045 398L1090 466Z" fill="url(#glass)" stroke="#42d9ff" stroke-width="4"/>
<path d="M735 340L720 462M890 340L900 462M1010 366L1055 460" stroke="#8ddfff" stroke-width="4" opacity=".6"/>
<!-- doors and pillars -->
<path d="M700 465L680 625M900 465L915 640M1080 475L1120 620" stroke="#18334c" stroke-width="5" opacity=".8"/>
<path d="M720 515H780M945 515H1005" stroke="#dff8ff" stroke-width="5" stroke-linecap="round" opacity=".75"/>
<!-- short bonnet and front fascia -->
<path d="M1080 480L1170 486L1290 515Q1350 535 1370 590L1150 608L1030 535Z" fill="#718ca4" opacity=".5"/>
<path d="M1110 570Q1240 555 1375 592L1365 644Q1290 670 1160 650Z" fill="#091b2c" stroke="#42d9ff" stroke-opacity=".75" stroke-width="3"/>
<path d="M1160 590Q1270 575 1350 595" stroke="#d9f8ff" stroke-width="11" stroke-linecap="round"/>
<path d="M1180 620H1330" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round"/>
<!-- side character lines -->
<path d="M330 610Q650 570 920 590T1350 620" fill="none" stroke="#e6f7ff" stroke-opacity=".65" stroke-width="4"/>
<path d="M390 645Q720 620 1030 645" fill="none" stroke="#42d9ff" stroke-opacity=".6" stroke-width="3"/>
<!-- wheels -->
<g><circle cx="505" cy="650" r="91" fill="#040b13" stroke="#829db2" stroke-width="11"/><circle cx="505" cy="650" r="58" fill="#172e43" stroke="#42d9ff" stroke-width="6"/><circle cx="505" cy="650" r="19" fill="#a7bdcc"/><path d="M505 594V706M449 650H561M465 610L545 690M545 610L465 690" stroke="#a7c7d8" stroke-width="5"/>
<circle cx="1195" cy="662" r="84" fill="#040b13" stroke="#829db2" stroke-width="11"/><circle cx="1195" cy="662" r="53" fill="#172e43" stroke="#42d9ff" stroke-width="6"/><circle cx="1195" cy="662" r="18" fill="#a7bdcc"/><path d="M1195 610V714M1143 662H1247M1158 625L1232 699M1232 625L1158 699" stroke="#a7c7d8" stroke-width="5"/></g>
<!-- concept-only smart mobility signals -->
<g fill="none" stroke="#42d9ff" stroke-width="2"><path d="M1050 290Q1320 340 1460 570" stroke-dasharray="9 12" opacity=".55"/><circle cx="1050" cy="300" r="90" opacity=".4"/><path d="M1350 570L1460 470H1520" opacity=".65"/></g>
<g font-family="Arial,Helvetica,sans-serif"><text x="1180" y="430" fill="#dff9ff" font-size="16" font-weight="700" letter-spacing="2">DRIVER ASSISTANCE</text><text x="1180" y="454" fill="#9bb6c9" font-size="13">CONCEPTUAL · NOT VALIDATED</text></g>
<rect x="70" y="790" width="1460" height="66" rx="14" fill="#0a1a2c" stroke="#304c68"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="98" y="818" fill="#42d9ff" font-size="14" font-weight="700" letter-spacing="2">PUI89 SHARED AI CORE</text><text x="98" y="841" fill="#d5e4f1" font-size="14">Observation → WorldState → Safety Gate → Advisory → Evidence</text><text x="1080" y="819" fill="#a8edbd" font-size="13" font-weight="700">HYBRID POWERTRAIN CONCEPT</text><text x="1080" y="841" fill="#b8c7da" font-size="12">HEV / PHEV architecture not selected</text></g>
</svg>