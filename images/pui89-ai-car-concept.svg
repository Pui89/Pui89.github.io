<g font-family="Arial,Helvetica,sans-serif">
 <text x="82" y="86" fill="#42d9ff" font-size="22" font-weight="700" letter-spacing="8">PUI89  /  VEHICLE INTELLIGENCE</text>
 <text x="80" y="168" fill="#f3f7ff" font-size="52" font-weight="800" letter-spacing="-2">COMPACT SMART EV</text>
 <text x="84" y="211" fill="#b8c7da" font-size="24" letter-spacing="2">HUMAN-DRIVER-FIRST · EVIDENCE-LED · SIMULATION-FIRST</text>
