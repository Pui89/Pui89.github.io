<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Multimodal Screening AI — workflow concept</title><desc id="desc">Illustrative laboratory-style inspection workflow with camera imagery, spectral sensor bands, an evidence fusion panel, uncertainty indicator, and human review checkpoint. It does not identify real substances.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172d43"/><stop offset="1" stop-color="#091624"/></linearGradient><linearGradient id="beam"><stop stop-color="#82d7c1" stop-opacity=".1"/><stop offset=".5" stop-color="#82d7c1" stop-opacity=".85"/><stop offset="1" stop-color="#82d7c1" stop-opacity=".1"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#a4c6dc" stroke-opacity=".08"/></pattern></defs>
<rect width="1200" height="650" fill="url(#bg)"/><rect width="1200" height="650" fill="url(#grid)"/>
<g transform="translate(40 36)"><rect width="330" height="60" rx="12" fill="#07131f" stroke="#739bb5" stroke-opacity=".6"/><circle cx="25" cy="30" r="6" fill="#9de0c9"/><text x="43" y="26" fill="#eef6ff" font-family="system-ui,sans-serif" font-size="17" font-weight="800" letter-spacing="1.1">MULTIMODAL SCREENING AI</text><text x="43" y="45" fill="#adc1d3" font-family="system-ui,sans-serif" font-size="11">EVIDENCE REVIEW • HUMAN IN THE LOOP</text></g>
<g transform="translate(55 160)"><rect width="300" height="350" rx="18" fill="#13283b" stroke="#5e8197" stroke-width="2"/><text x="23" y="34" fill="#9de0c9" font-family="system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">INPUT SOURCES</text>
<rect x="22" y="55" width="256" height="76" rx="10" fill="#203c51"/><g transform="translate(38 71)"><rect width="48" height="43" rx="7" fill="#0b1b2a" stroke="#8cb5c6" stroke-width="2"/><circle cx="24" cy="21" r="13" fill="#78b9b0"/><circle cx="24" cy="21" r="6" fill="#172e40"/><path d="M8 0V-7H40V0" fill="none" stroke="#8cb5c6" stroke-width="3"/></g><text x="103" y="85" fill="#eef6ff" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Visual evidence</text><text x="103" y="107" fill="#adc1d3" font-family="system-ui,sans-serif" font-size="12">Image / package view</text>
<rect x="22" y="145" width="256" height="76" rx="10" fill="#203c51"/><g transform="translate(39 164)"><path d="M0 26H53" stroke="#9de0c9" stroke-width="2"/><path d="M0 26 7 26 11 8 16 38 22 18 27 26 34 3 40 31 45 20 53 26" fill="none" stroke="#f0d49a" stroke-width="3"/></g><text x="103" y="175" fill="#eef6ff" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Sensor readings</text><text x="103" y="197" fill="#adc1d3" font-family="system-ui,sans-serif" font-size="12">Only when available</text>
<rect x="22" y="235" width="256" height="76" rx="10" fill="#203c51"/><g transform="translate(40 252)" fill="none" stroke="#9de0c9" stroke-width="3"><path d="M0 9H42M0 22H30M0 35H47"/><circle cx="48" cy="9" r="5"/><circle cx="36" cy="22" r="5"/><circle cx="53" cy="35" r="5"/></g><text x="103" y="265" fill="#eef6ff" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Case metadata</text><text x="103" y="287" fill="#adc1d3" font-family="system-ui,sans-serif" font-size="12">Provenance / quality</text>
<text x="22" y="332" fill="#adc1d3" font-family="system-ui,sans-serif" font-size="12">Missing data stays marked missing.</text></g>
<g stroke="#9de0c9" stroke-width="4" fill="none" stroke-linecap="round"><path d="M360 265H430"/><path d="M418 253 430 265 418 277"/><path d="M360 355H430"/><path d="M418 343 430 355 418 367"/></g>
<g transform="translate(445 192)"><rect width="310" height="270" rx="18" fill="#13283b" stroke="#6e9caa" stroke-width="2"/><text x="24" y="35" fill="#9de0c9" font-family="system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">EVIDENCE FUSION</text><text x="24" y="65" fill="#dce9f4" font-family="system-ui,sans-serif" font-size="13">Compare signals and record gaps</text><rect x="24" y="88" width="262" height="44" rx="8" fill="#203c51"/><rect x="36" y="101" width="135" height="17" rx="4" fill="url(#beam)"/><text x="184" y="115" fill="#dce9f4" font-family="system-ui,sans-serif" font-size="12">Signal A</text><rect x="24" y="143" width="262" height="44" rx="8" fill="#203c51"/><rect x="36" y="156" width="87" height="17" rx="4" fill="#f0d49a" fill-opacity=".8"/><text x="184" y="170" fill="#dce9f4" font-family="system-ui,sans-serif" font-size="12">Signal B</text><rect x="24" y="198" width="262" height="44" rx="8" fill="#352c25" stroke="#b78e53" stroke-opacity=".7"/><text x="38" y="225" fill="#f0d49a" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Uncertainty retained</text></g>
<path d="M760 327H820" stroke="#9de0c9" stroke-width="4" fill="none"/><path d="M808 315 820 327 808 339" stroke="#9de0c9" stroke-width="4" fill="none"/>
<g transform="translate(840 192)"><rect width="310" height="270" rx="18" fill="#13283b" stroke="#b7a071" stroke-width="2"/><text x="24" y="35" fill="#f0d49a" font-family="system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">HUMAN REVIEW</text><circle cx="155" cy="105" r="40" fill="#263e4d" stroke="#9de0c9" stroke-width="3"/><circle cx="155" cy="91" r="13" fill="#9de0c9"/><path d="M129 126Q155 99 181 126" fill="#9de0c9"/><rect x="32" y="162" width="246" height="38" rx="8" fill="#203c51"/><text x="155" y="186" text-anchor="middle" fill="#eef6ff" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Review evidence + context</text><rect x="32" y="210" width="246" height="38" rx="8" fill="#352c25"/><text x="155" y="234" text-anchor="middle" fill="#f0d49a" font-family="system-ui,sans-serif" font-size="13" font-weight="700">No automatic identification</text></g>
<rect x="0" y="590" width="1200" height="60" fill="#07131f" fill-opacity=".92"/><text x="42" y="620" fill="#dce9f4" font-family="system-ui,sans-serif" font-size="15">ILLUSTRATIVE WORKFLOW CONCEPT — NOT A CHEMICAL TEST OR VALIDATED DETECTOR</text><text x="42" y="638" fill="#9eb5c7" font-family="system-ui,sans-serif" font-size="11">Example sensor bands are schematic only; no real substance identity or sensor result is represented.</text>
