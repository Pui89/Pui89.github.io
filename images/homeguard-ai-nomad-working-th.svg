 <rect x="110" y="80" width="240" height="264" rx="28" fill="none" stroke="#6d9ab7" stroke-width="3"/>
 <path d="M132 104H328" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round"/>
 <rect x="157" y="145" width="146" height="112" rx="20" fill="#071523" stroke="#4bdcf8" stroke-width="3"/>
 <circle cx="203" cy="190" r="18" fill="#54e2fb"/><circle cx="203" cy="190" r="7" fill="#071523"/>
 <circle cx="255" cy="190" r="14" fill="#54e2fb"/>
 <path d="M182 226H278" stroke="#55e3fa" stroke-width="5" stroke-linecap="round"/>
 <text x="230" y="292" class="label" text-anchor="middle">NOMAD</text>
 <g fill="#07101c" stroke="#7096af" stroke-width="4">
  <rect x="108" y="340" width="42" height="40" rx="13"/><rect x="310" y="340" width="42" height="40" rx="13"/>
