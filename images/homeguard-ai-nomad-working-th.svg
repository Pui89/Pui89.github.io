 </g>
 <text x="230" y="430" class="label" text-anchor="middle">CARRY-ON SUITCASE AI</text>
 <text x="230" y="460" class="copy" text-anchor="middle">Four spinner caster wheels • proposed</text>
</g>
<rect x="95" y="755" width="460" height="125" rx="18" fill="#0b1e31" stroke="#35556e" stroke-width="2"/>
<text x="122" y="795" class="micro">ข้อมูลนำเข้า (เมื่อติดตั้งและตรวจสอบแล้ว)</text>
<text x="122" y="834" class="copy">กล้อง • ความร้อน • สิ่งกีดขวาง • GPS</text>
<text x="122" y="862" class="copy">สถานะแบตเตอรี่ / ล้อ • แผนที่ในเครื่อง</text>

<!-- Workflow top row -->
<g>
 <rect x="650" y="265" width="310" height="170" rx="20" class="panel"/>
 <circle cx="690" cy="307" r="22" fill="url(#cyan)"/><text x="690" y="315" class="number" text-anchor="middle">1</text>
 <text x="728" y="315" class="label">สังเกต</text>
 <text x="680" y="370" class="copy">รวบรวมข้อมูลจากกล้องและ</text><text x="680" y="400" class="copy">เซนเซอร์รอบตัวหุ่นยนต์</text>
 <path d="M960 350H1015" class="arrow"/>
 <rect x="1025" y="265" width="310" height="170" rx="20" class="panel"/>
 <circle cx="1065" cy="307" r="22" fill="url(#cyan)"/><text x="1065" y="315" class="number" text-anchor="middle">2</text>
 <text x="1103" y="315" class="label">ตรวจคุณภาพข้อมูล</text>
 <text x="1055" y="370" class="copy">ตรวจความใหม่ สุขภาพเซนเซอร์</text><text x="1055" y="400" class="copy">การปรับเทียบ และความไม่แน่นอน</text>
 <path d="M1335 350H1390" class="arrow"/>
 <rect x="1400" y="265" width="310" height="170" rx="20" class="panel"/>
 <circle cx="1440" cy="307" r="22" fill="url(#cyan)"/><text x="1440" y="315" class="number" text-anchor="middle">3</text>
 <text x="1478" y="315" class="label">ทำความเข้าใจ</text>
 <text x="1430" y="370" class="copy">เชื่อมข้อมูลกับตำแหน่ง</text><text x="1430" y="400" class="copy">เวลา และบริบทที่ทราบ</text>
 <path d="M1555 435V500" class="arrow"/>
 <rect x="1400" y="515" width="310" height="170" rx="20" class="panel"/>
 <circle cx="1440" cy="557" r="22" fill="url(#cyan)"/><text x="1440" y="565" class="number" text-anchor="middle">4</text>
 <text x="1478" y="565" class="label">เลือกอย่างปลอดภัย</text>
 <text x="1430" y="620" class="copy">เคลื่อนที่ พัก กลับ หรือ</text><text x="1430" y="650" class="copy">หยุดอย่างปลอดภัยตามเงื่อนไข</text>
 <path d="M1400 600H1345" class="arrow"/>
 <rect x="1025" y="515" width="310" height="170" rx="20" class="panel"/>
 <circle cx="1065" cy="557" r="22" fill="url(#cyan)"/><text x="1065" y="565" class="number" text-anchor="middle">5</text>
 <text x="1103" y="565" class="label">รายงานเจ้าของ</text>
 <text x="1055" y="620" class="copy">แสดงสิ่งที่สังเกตพบ</text><text x="1055" y="650" class="copy">สิ่งที่ยังไม่แน่ใจและควรตรวจสอบ</text>
 <path d="M1025 600H970" class="arrow"/>
 <rect x="650" y="515" width="310" height="170" rx="20" class="panel"/>
 <text x="680" y="562" class="micro">มนุษย์เป็นผู้ตัดสินใจ</text>
 <text x="680" y="608" class="label">เจ้าของตรวจสอบการแจ้งเตือน</text>
 <text x="680" y="650" class="copy">มนุษย์เป็นผู้กำหนดขั้นตอนต่อไป</text>
</g>
<!-- Modes -->
<text x="650" y="760" class="micro">3 โหมดภายใต้การดูแล</text>
<g>
 <rect x="650" y="785" width="310" height="90" rx="16" fill="#0b1e31" stroke="#35556e" stroke-width="2"/>
 <text x="675" y="822" class="label">HOME</text><text x="675" y="852" class="copy">ตรวจภายใน • กลับแท่นเมื่อปลอดภัย</text>
 <rect x="980" y="785" width="310" height="90" rx="16" fill="#0b1e31" stroke="#35556e" stroke-width="2"/>
 <text x="1005" y="822" class="label">เดินทาง</text><text x="1005" y="852" class="copy">เจ้าของอยู่ใกล้ • พื้นที่กำหนด</text>
 <rect x="1310" y="785" width="400" height="90" rx="16" fill="#0b1e31" stroke="#35556e" stroke-width="2"/>
 <text x="1335" y="822" class="label">ตั้งแคมป์</text><text x="1335" y="852" class="copy">เฝ้าสังเกตเสียงเบา • แจ้งเจ้าของ</text>
</g>
<rect x="650" y="915" width="1060" height="110" rx="18" fill="#102d3b" stroke="#55dff8" stroke-width="2"/>
<text x="680" y="957" class="micro">เงื่อนไขความปลอดภัย</text>
<text x="680" y="998" class="label">กลับเมื่อ ตำแหน่ง + เส้นทาง + แบตเตอรี่ ปลอดภัย</text>
<text x="1310" y="998" class="label" fill="#ffd99a">หากไม่ปลอดภัย: หยุดอย่างปลอดภัย</text>
<text x="95" y="1080" class="copy">ภาพแนวคิดเท่านั้น — ขั้นตอนเป็นข้อเสนอ ยังไม่มีการยืนยันฮาร์ดแวร์ การเชื่อมต่อเซนเซอร์ หรือการทำงานอัตโนมัติ</text>
</svg>