<text x="82" y="164" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="50" font-weight="700">AI ROBOT MOTORCYCLE</text>
<text x="84" y="204" fill="#a9c3d6" font-family="Arial,sans-serif" font-size="22" letter-spacing="2">ELECTRIC SPORT-TOURING · ADVISORY-FIRST CONCEPT</text>
