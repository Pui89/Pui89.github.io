<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">PUI89 AI Robot Motorcycle — electric intelligence concept</title>
<desc id="desc">A futuristic electric sport-touring motorcycle concept in deep navy and electric cyan, with conceptual camera, radar, inertial and wheel-state sensing callouts. Not production CAD.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#102940"/><stop offset="1" stop-color="#07111f"/></linearGradient>
 <linearGradient id="fair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9f3ff"/><stop offset=".24" stop-color="#238eb8"/><stop offset=".68" stop-color="#123653"/><stop offset="1" stop-color="#071725"/></linearGradient>
 <linearGradient id="cyan" x2="1"><stop stop-color="#167da5"/><stop offset=".5" stop-color="#42d9ff"/><stop offset="1" stop-color="#a8f1ff"/></linearGradient>
 <linearGradient id="tire" x2="0" y2="1"><stop stop-color="#24394b"/><stop offset="1" stop-color="#050b12"/></linearGradient>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#23415a" stroke-width="1" opacity=".32"/></pattern>
</defs>
