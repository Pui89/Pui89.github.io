<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Premium Wordmark</title>
<desc id="desc">PUI89 wordmark in Platinum Titanium and Sapphire Blue on Deep Navy. The upper third of the N's right vertical pillar is solid Sapphire Blue, edge-to-edge.</desc>
<defs>
  <linearGradient id="titanium" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F5F4F1"/>
    <stop offset=".5" stop-color="#E5E4E2"/>
    <stop offset="1" stop-color="#C5C4C0"/>
  </linearGradient>
  <clipPath id="nShape">
    <path d="M70 35H142L278 215V35H350V265H278L142 85V265H70Z"/>
  </clipPath>
</defs>
<g>
  <path d="M70 35H142L278 215V35H350V265H278L142 85V265H70Z" fill="url(#titanium)"/>
  <rect x="278" y="35" width="72" height="76.67" fill="#0F52BA" clip-path="url(#nShape)"/>
</g>
<text x="390" y="204" font-family="Arial, Helvetica, sans-serif" font-size="142" font-weight="850" letter-spacing="-3"><tspan fill="#E5E4E2">PUI</tspan><tspan fill="#0F52BA">89</tspan></text>
</svg>
