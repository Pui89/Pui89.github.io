 <text x="65" y="250" fill="#fff" font-size="21" font-weight="700">Carry-on luggage body</text>
 <text x="65" y="278" fill="#b4cbd9" font-size="16">Four-wheel travel-suitcase form</text>
</g>
<rect x="64" y="712" width="1072" height="76" rx="15" fill="#061827" stroke="#285a76" stroke-width="2"/>
