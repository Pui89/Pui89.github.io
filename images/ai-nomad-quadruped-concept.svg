<text x="70" y="90" fill="#42d9ff" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="6">PUI89 / AI NOMAD</text>
<text x="70" y="130" fill="#e8f1fa" font-family="Arial,sans-serif" font-size="40" font-weight="700">QUADRUPED ROBOT CONCEPT</text>
<text x="72" y="660" fill="#b7c9d9" font-family="Arial,sans-serif" font-size="19">Illustrative design direction only · no physical prototype or locomotion performance validated</text>
