<text x="65" y="808" fill="#91a9ba" font-family="Arial,sans-serif" font-size="13">PROPOSED CARRY-ON SUITCASE FORM · Four base spinner casters · Complete mass target 8–10 kg, 10 kg maximum. Payload and outdoor/weather limits remain unvalidated.</text>
