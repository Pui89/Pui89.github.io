<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">PUI89 AI NOMAD quadruped robot concept</title>
<desc id="desc">Concept illustration of a compact four-legged mobile robot with a central equipment body, sensor head, articulated legs and cyan status lighting. Not a built or validated robot.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142b43"/><stop offset="1" stop-color="#07111f"/></linearGradient>
 <linearGradient id="body" x2="0" y2="1"><stop stop-color="#344c65"/><stop offset="1" stop-color="#111f30"/></linearGradient>
 <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#d7e1e9"/><stop offset="1" stop-color="#71869a"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="700" fill="url(#bg)"/>
<g opacity=".22" stroke="#42d9ff"><path d="M0 560H1200M0 600H1200M0 640H1200"/><path d="M100 0V700M200 0V700M300 0V700M400 0V700M500 0V700M600 0V700M700 0V700M800 0V700M900 0V700M1000 0V700M1100 0V700"/></g>
<ellipse cx="600" cy="565" rx="370" ry="48" fill="#020810" opacity=".65"/>
<g stroke="#07111d" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
