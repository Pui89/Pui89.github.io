</g>
<path d="M390 285Q410 220 500 215L710 215Q795 225 815 300L785 405Q760 438 700 440H495Q425 430 400 395Z" fill="url(#body)" stroke="#6f8ba4" stroke-width="8"/>
<path d="M430 290Q450 245 510 242H695Q755 248 775 295L755 355H450Z" fill="#203b56" stroke="#42d9ff" stroke-width="4"/>
<path d="M485 275H715L740 330H460Z" fill="#0b1725" stroke="#6c8da8" stroke-width="3"/>
<path d="M520 295H680" stroke="#42d9ff" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
<rect x="560" y="185" width="80" height="42" rx="12" fill="#263d55" stroke="#8da5bb" stroke-width="5"/>
<path d="M600 185V150" stroke="#9eb4c8" stroke-width="12" stroke-linecap="round"/>
