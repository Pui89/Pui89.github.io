 <path d="M420 370L360 455L325 555" fill="none" stroke="url(#metal)" stroke-width="34"/>
 <path d="M760 370L825 455L860 555" fill="none" stroke="#263b50" stroke-width="58"/>
 <path d="M760 370L825 455L860 555" fill="none" stroke="url(#metal)" stroke-width="34"/>
 <!-- front legs -->
 <path d="M510 390L485 475L470 565" fill="none" stroke="#263b50" stroke-width="60"/>
 <path d="M510 390L485 475L470 565" fill="none" stroke="url(#metal)" stroke-width="35"/>
 <path d="M690 390L720 475L745 565" fill="none" stroke="#263b50" stroke-width="60"/>
 <path d="M690 390L720 475L745 565" fill="none" stroke="url(#metal)" stroke-width="35"/>
</g>
<g fill="#14283c" stroke="#42d9ff" stroke-width="5">
 <circle cx="360" cy="455" r="27"/><circle cx="825" cy="455" r="27"/>
 <circle cx="485" cy="475" r="28"/><circle cx="720" cy="475" r="28"/>
 <circle cx="325" cy="555" r="22"/><circle cx="860" cy="555" r="22"/>
