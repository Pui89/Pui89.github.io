<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">PUI89 Dual Blue Industrial Signature</title>
  <desc id="desc">A strong, standard solid capital N in titanium silver. The upper third of its right vertical pillar uses a deep-blue to electric-cyan gradient. The PUI wordmark is titanium silver and 89 uses both deep blue and electric cyan. No underline or tagline.</desc>
  <defs>
    <linearGradient id="pui89Titanium" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset=".48" stop-color="#C2CED9"/>
      <stop offset="1" stop-color="#8295A8"/>
    </linearGradient>
    <linearGradient id="pui89DualBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1456A0"/>
      <stop offset=".52" stop-color="#087FC4"/>
      <stop offset="1" stop-color="#00D5FF"/>
    </linearGradient>
  </defs>
  <!-- Standard solid N: flat ends, straight pillars, one strong diagonal. -->
  <path d="M38 28 H82 L158 132 V28 H202 V190 H158 L82 86 V190 H38 Z"
        fill="url(#pui89Titanium)"/>
  <!-- Blue treatment is limited to the top third of the right pillar. -->
  <rect x="158" y="28" width="44" height="54" fill="url(#pui89DualBlue)"/>
  <!-- Silver PUI and dual-blue 89 wordmark. -->
  <text x="250" y="143" fill="url(#pui89Titanium)"
        font-family="Arial, Helvetica, sans-serif" font-size="112"
        font-weight="800" letter-spacing="2.2">PUI</text>
  <text x="465" y="143" fill="url(#pui89DualBlue)"
        font-family="Arial, Helvetica, sans-serif" font-size="112"
        font-weight="800" letter-spacing="2.2">89</text>
</svg>
