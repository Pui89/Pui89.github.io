<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Flow Matrix — Unified Emerald</title>
<desc id="desc">The PUI89 Flow Matrix N symbol and PUI89 wordmark share one coordinated emerald-green gradient matched to the website accent palette.</desc>
<defs>
  <linearGradient id="pui89BrandGreen" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#315F45"/>
    <stop offset=".48" stop-color="#6FAF82"/>
    <stop offset="1" stop-color="#C5E9A9"/>
  </linearGradient>
  <linearGradient id="pui89Beam" x1="49" y1="42" x2="119" y2="108" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#C5E9A9" stop-opacity=".35"/>
    <stop offset=".5" stop-color="#F6F8F1"/>
    <stop offset="1" stop-color="#C5E9A9" stop-opacity=".35"/>
  </linearGradient>
  <filter id="pui89SoftGlow" x="-30%" y="-80%" width="160%" height="260%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
    <feFlood flood-color="#8FBD91" flood-opacity=".24" result="glowColor"/>
    <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
    <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="pui89BeamGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>
<!-- Original Flow Matrix N geometry retained. -->
<path d="M25 25H49L119 91V25H143V125H119L49 59V125H25Z" fill="url(#pui89BrandGreen)"/>
<path d="M49 42L119 108" fill="none" stroke="#C5E9A9" stroke-width="15" stroke-linecap="butt" opacity=".38" filter="url(#pui89BeamGlow)"/>
<path d="M49 42L119 108" fill="none" stroke="url(#pui89Beam)" stroke-width="7" stroke-linecap="butt"/>
<path d="M49 42L119 108" fill="none" stroke="#F6F8F1" stroke-width="1.8" stroke-linecap="butt" opacity=".9"/>
<circle cx="84" cy="75" r="18" fill="#C5E9A9" opacity=".28"/>
<circle cx="84" cy="75" r="7" fill="#E7F4DE"/>
<circle cx="84" cy="75" r="2.5" fill="#FFFFFF"/>
<!-- N symbol and wordmark use the same brand gradient. -->
<text x="190" y="94" fill="url(#pui89BrandGreen)" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="900" letter-spacing="2" filter="url(#pui89SoftGlow)">PUI89</text>
</svg>