<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Cyber Edge</title>
<desc id="desc">PUI89 geometric metallic N mark with an electric cyan forward slash and a restrained orbital arc, paired with a silver wordmark on a transparent background.</desc>
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".28" stop-color="#B8D5EA"/>
    <stop offset=".58" stop-color="#477DA7"/><stop offset=".82" stop-color="#E8F7FF"/>
    <stop offset="1" stop-color="#719AB8"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#007BFF"/><stop offset=".42" stop-color="#00D9FF"/>
    <stop offset=".7" stop-color="#B7FAFF"/><stop offset="1" stop-color="#00A9FF"/>
  </linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#D7E9F6"/><stop offset="1" stop-color="#8CB6D5"/>
  </linearGradient>
  <filter id="cyanGlow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<!-- Square-cut N: deliberately simple and recognisable at small sizes. -->
<path d="M24 22H54L146 102V22H176V128H146L54 48V128H24Z" fill="url(#metal)" stroke="#7FB8E5" stroke-width="1.5"/>
<path d="M54 39L146 119" stroke="#163D5F" stroke-width="3" opacity=".75"/>
<!-- The Cyber Edge: a crisp cyan diagonal crossing the mark. -->
<path d="M12 119L184 14" stroke="url(#edge)" stroke-width="7" stroke-linecap="square" filter="url(#cyanGlow)"/>
<path d="M12 119L184 14" stroke="#D8FCFF" stroke-width="1.5" opacity=".95"/>
<!-- A restrained orbital sweep reinforces motion without enclosing the mark. -->
<path d="M18 103C58 5 153 -5 194 36" fill="none" stroke="#00BFFF" stroke-width="2.1" opacity=".88" filter="url(#softGlow)"/>
<path d="M191 32L198 38L188 39" fill="none" stroke="#55E9FF" stroke-width="2"/>
<text x="218" y="101" fill="url(#word)" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="900" letter-spacing="1.5">PUI89</text>
<path d="M220 119H490" stroke="#00CFFF" stroke-width="1.4" opacity=".78"/>
<circle cx="490" cy="119" r="2.6" fill="#55E9FF" filter="url(#softGlow)"/>
</svg>