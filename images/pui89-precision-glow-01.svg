<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Cyber Edge</title>
<desc id="desc">A square-cut metallic N crossed by one sharp electric-cyan diagonal edge, paired with a silver PUI89 wordmark. No orbit, ring or circular element.</desc>
<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".28" stop-color="#B8D5EA"/>
    <stop offset=".58" stop-color="#477DA7"/>
    <stop offset=".82" stop-color="#E8F7FF"/>
    <stop offset="1" stop-color="#719AB8"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#007BFF"/>
    <stop offset=".42" stop-color="#00D9FF"/>
    <stop offset=".7" stop-color="#B7FAFF"/>
    <stop offset="1" stop-color="#00A9FF"/>
  </linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".55" stop-color="#D7E9F6"/>
    <stop offset="1" stop-color="#8CB6D5"/>
  </linearGradient>
  <filter id="cyanGlow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<!-- Bold geometric N with flat, square-cut terminals. -->
<path d="M24 22H54L146 102V22H176V128H146L54 48V128H24Z"
      fill="url(#metal)" stroke="#7FB8E5" stroke-width="1.5"/>
<path d="M54 39L146 119" stroke="#163D5F" stroke-width="3" opacity=".75"/>
<!-- One clean Cyber Edge slash: no orbit, ring, loop or circular motif. -->
<path d="M12 119L184 14" stroke="url(#edge)" stroke-width="7"
      stroke-linecap="square" filter="url(#cyanGlow)"/>
<path d="M12 119L184 14" stroke="#D8FCFF" stroke-width="1.5"/>
<!-- Wordmark. -->
<text x="218" y="101" fill="url(#word)"
      font-family="Arial, Helvetica, sans-serif" font-size="68"
      font-weight="900" letter-spacing="1.5">PUI89</text>
<path d="M220 119H490" stroke="#00CFFF" stroke-width="1.4" opacity=".78"/>
</svg>