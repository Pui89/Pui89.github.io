 <path d="M710 349 H850 L877 322" stroke="#70e7f8" stroke-width="2" fill="none"/>
 <text x="890" y="321" fill="#fff" font-size="21" font-weight="700">Emergency-stop control</text>
 <text x="890" y="348" fill="#b4cbd9" font-size="16">Physical design requirement</text>
 <path d="M783 607 H850 L877 580" stroke="#70e7f8" stroke-width="2" fill="none"/>
 <text x="890" y="579" fill="#fff" font-size="21" font-weight="700">Four recessed wheels</text>
 <text x="890" y="606" fill="#b4cbd9" font-size="16">Protected wheel housings</text>
 <text x="65" y="250" fill="#fff" font-size="21" font-weight="700">Portable upright body</text>
 <text x="65" y="278" fill="#b4cbd9" font-size="16">Distinct from the low-profile AI HOME</text>
</g>
<rect x="64" y="712" width="1072" height="76" rx="15" fill="#061827" stroke="#285a76" stroke-width="2"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="190" y="740" fill="#78eaff" font-size="13" letter-spacing="2">WIDTH</text><text x="190" y="770" fill="#fff" font-size="21" font-weight="700">30–33 cm</text>
 <text x="410" y="740" fill="#78eaff" font-size="13" letter-spacing="2">LENGTH</text><text x="410" y="770" fill="#fff" font-size="21" font-weight="700">35–40 cm</text>
 <text x="630" y="740" fill="#78eaff" font-size="13" letter-spacing="2">BODY HEIGHT</text><text x="630" y="770" fill="#fff" font-size="21" font-weight="700">35–40 cm</text>
 <text x="870" y="740" fill="#78eaff" font-size="13" letter-spacing="2">COMPLETE MASS TARGET</text><text x="870" y="770" fill="#fff" font-size="21" font-weight="700">≤ 6 kg</text>
