<text x="566" y="560" text-anchor="middle" fill="#e7faff" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">NOMAD</text>
<text x="566" y="588" text-anchor="middle" fill="#91b9cc" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">PUI89 MOBILE ASSISTANT</text>
<!-- visible emergency stop -->
