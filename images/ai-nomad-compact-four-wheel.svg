<rect x="489" y="396" width="154" height="72" rx="17" fill="#153d57" stroke="#6de6f8" stroke-width="2"/>
<circle cx="535" cy="432" r="17" fill="#081d2d" stroke="#91efff" stroke-width="3"/>
<circle cx="535" cy="432" r="6" fill="#8befff"/>
<circle cx="594" cy="432" r="10" fill="#081d2d" stroke="#91efff" stroke-width="3"/>
