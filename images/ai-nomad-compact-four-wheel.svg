<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">PUI89 AI NOMAD — compact mobile assistant with retractable handle</title>
<desc id="desc">A separate compact four-wheel mobile assistant with a rounded vertical suitcase-like body, telescopic pull handle, recessed protected wheels and a front sensing panel. Proposed body envelope 30–33 cm wide, 35–40 cm long and 35–40 cm high excluding the handle. Complete robot mass target no more than 6 kg including battery and handle; initial payload target 1 kg.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#153650"/></linearGradient>
 <linearGradient id="shell" x2="1" y2="1"><stop stop-color="#315b76"/><stop offset=".52" stop-color="#142f46"/><stop offset="1" stop-color="#071827"/></linearGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#eef5f8"/><stop offset="1" stop-color="#7d99aa"/></linearGradient>
 <linearGradient id="cyan"><stop stop-color="#19b9d9"/><stop offset="1" stop-color="#83efff"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="820" rx="28" fill="url(#bg)"/>
<text x="64" y="70" fill="#78eaff" font-family="Arial,sans-serif" font-size="21" letter-spacing="5">PUI89 / MOBILE ROBOTICS</text>
<text x="64" y="132" fill="#fff" font-family="Arial,sans-serif" font-size="56" font-weight="700">AI NOMAD</text>
<text x="66" y="172" fill="#b9d0df" font-family="Arial,sans-serif" font-size="20" letter-spacing="1">COMPACT MOBILE ASSISTANT · SUITCASE-INSPIRED FORM</text>
<ellipse cx="555" cy="680" rx="270" ry="34" fill="#000" opacity=".42" filter="url(#shadow)"/>
