" cy="460" r="22"/><circle cx="50" cy="385" r="19"/><circle cx="330" cy="385" r="19"/></g><g fill="#13d3f4"><circle cx="90" cy="460" r="7"/><circle cx="290" cy="460" r="7"/><circle cx="50" cy="385" r="6"/><circle cx="330" cy="385" r="6"/></g><text x="190" y="525" text-anchor="middle" fill="#b9efff" font-family="Arial" font-size="18">Slim hard-shell travel body</text></g><g transform="translate(585 245)"><rect x="105" y="0" width="100" height="65" rx="17" fill="#102e4b" stroke="#48dff7" stroke-width="4"/><circle cx="135" cy="32" r="11" fill="#061321" stroke="#6eeaff" stroke-width="4"/><circle cx="175" cy="32" r="11" fill="#061321" stroke="#6eeaff" stroke-width="4"/><rect x="65" y="78" width="180" height="300" rx="30" fill="url(#body)" stroke="#668cae" stroke-width="5"/><rect x="78" y="92" width="154" height="272" rx="23" fill="none" stroke="url(#c)" stroke-width="4"/><text x="155" y="245" text-anchor="middle" fill="white" font-family="Arial" font-size="27" font-weight="700">N</text><text x="155" y="275" text-anchor="middle" fill="#9cecff" font-family="Arial" font-size="17">NOMAD</text><g fill="#071321" stroke="#83b3d0" stroke-width="6"><circle cx="55" cy="380" r="22"/><circle cx="255" cy="380" r="22"/><circle cx="55" cy="115" r="19"/><circle cx="255" cy="115" r="19"/></g><text x="155" y="445" text-anchor="middle" fill="#b9efff" font-family="Arial" font-size="18">4 compact wheels</text><text x="155" y="472" text-anchor="middle" fill="#b9efff" font-family="Arial" font-size="16">Retractable handle</text></g><rect x="900" y="200" width="250" height="440" rx="20" fill="#f5f9fc"/><rect x="900" y="200" width="250" height="58" rx="20" fill="#07335d"/><text x="1025" y="238" text-anchor="middle" fill="white" font-family="Arial" font-size="23" font-weight="700">TARGET SPECS</text><g font-family="Arial" fill="#102a46" font-size="17"><text x="920" y="296">Height</text><text x="1130" y="296" text-anchor="end" font-weight="700">50–60 cm</text><path d="M920 310H1130" stroke="#cbd8e3