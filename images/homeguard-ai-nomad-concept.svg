<title id="title">PUI89 HOMEGUARD AI NOMAD — quadruped robot dog concept</title><desc id="desc">Compact deep-navy and electric-cyan quadruped robot dog with four articulated protected legs, sensor head, balanced central body and removable protected battery. Concept only, not built or validated.</desc>
