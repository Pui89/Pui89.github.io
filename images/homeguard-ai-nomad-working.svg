 <text x="82" y="354" fill="#F3F7FF" font-size="24" font-weight="750">Local sensors</text>
 <text x="82" y="392" fill="#B8C7DA" font-size="17">RGB · optional depth · IMU</text>
 <text x="82" y="420" fill="#B8C7DA" font-size="17">Wheel / battery telemetry</text>
 <rect x="392" y="270" width="300" height="180" rx="20" fill="#10243A" stroke="#29445E" stroke-width="2"/>
 <text x="418" y="312" fill="#42D9FF" font-size="16" font-weight="800">02 / VALIDATE</text>
 <text x="418" y="354" fill="#F3F7FF" font-size="24" font-weight="750">Evidence gate</text>
 <text x="418" y="392" fill="#B8C7DA" font-size="17">Source · time · quality</text>
 <text x="418" y="420" fill="#B8C7DA" font-size="17">Calibration · uncertainty</text>
 <rect x="728" y="270" width="300" height="180" rx="20" fill="#10243A" stroke="#29445E" stroke-width="2"/>
 <text x="754" y="312" fill="#42D9FF" font-size="16" font-weight="800">03 / UNDERSTAND</text>
 <text x="754" y="354" fill="#F3F7FF" font-size="24" font-weight="750">Travel WorldState</text>
 <text x="754" y="392" fill="#B8C7DA" font-size="17">Luggage · scene · obstacles</text>
 <text x="754" y="420" fill="#B8C7DA" font-size="17">Mode · device health · events</text>
 <rect x="1064" y="270" width="320" height="180" rx="20" fill="#10243A" stroke="#29445E" stroke-width="2"/>
 <text x="1090" y="312" fill="#42D9FF" font-size="16" font-weight="800">04 / ASSIST</text>
 <text x="1090" y="354" fill="#F3F7FF" font-size="24" font-weight="750">Owner dashboard</text>
 <text x="1090" y="392" fill="#B8C7DA" font-size="17">Checklist · alerts · evidence</text>
 <text x="1090" y="420" fill="#B8C7DA" font-size="17">Human review · reminders</text>
