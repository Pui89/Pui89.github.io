<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">PUI89 AI NOMAD — travel suitcase AI architecture</title>
<desc id="desc">Proposed architecture for a suitcase-form AI assistant: removable battery and device telemetry, camera and optional depth/IMU/wheel inputs, local perception, travel and luggage world state, dashboard and evidence, with a separate independent safety controller. Travel mode is manual, flight mode powers off, and future robot mode is supervised in permitted controlled areas only.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#0C1B2D"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42D9FF"/><stop offset="1" stop-color="#B8F2FF"/></linearGradient></defs>
<rect width="1440" height="820" rx="28" fill="url(#bg)"/>
<text x="56" y="76" fill="#42D9FF" font-size="17" font-weight="800" letter-spacing="4">PUI89 / TECHNICAL VISUALS</text>
<text x="56" y="132" fill="#F3F7FF" font-size="39" font-weight="850">PUI89 AI NOMAD</text>
<text x="58" y="164" fill="#B8C7DA" font-size="18" letter-spacing="2">AI TRAVEL SUITCASE · FOUR WHEELS · RETRACTABLE HANDLE · REMOVABLE BATTERY</text>
<path d="M56 194H1384" stroke="#29445E" stroke-width="2"/>
<text x="56" y="236" fill="#B8F2FF" font-size="16" font-weight="800" letter-spacing="2">LOCAL AI INTELLIGENCE FLOW (PROPOSED)</text>
