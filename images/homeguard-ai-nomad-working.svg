 <text x="82" y="550" fill="#42D9FF" font-size="16" font-weight="800" letter-spacing="2">INDEPENDENT SAFETY SUPERVISOR — REQUIRED BEFORE POWERED MOBILITY</text>
 <text x="82" y="590" fill="#F3F7FF" font-size="19">Mode interlocks · motor disable · watchdog · braking · emergency stop · manual override · safe hold</text>
