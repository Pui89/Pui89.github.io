<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">PUI89 HOMEGUARD AI NOMAD quadruped robot dog concept</title>
<desc id="desc">A compact navy and electric-cyan four-legged outdoor guardian robot dog with articulated legs, sensor head, camera eyes, lidar module, protective shell and proposed 8 to 10 kilogram target. Concept only.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#12395b"/></linearGradient>
 <linearGradient id="shell" x2="1" y2="1"><stop stop-color="#315777"/><stop offset=".55" stop-color="#173650"/><stop offset="1" stop-color="#091a2c"/></linearGradient>
 <linearGradient id="cyan" x2="1"><stop stop-color="#83f8ff"/><stop offset="1" stop-color="#00bde8"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="900" rx="32" fill="url(#bg)"/>
<circle cx="1110" cy="240" r="260" fill="#17bde5" opacity=".07"/><circle cx="230" cy="720" r="250" fill="#17bde5" opacity=".06"/>
<text x="72" y="76" fill="#83efff" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">PUI89  /  PORTABLE INTELLIGENT ROBOT</text>
<text x="72" y="145" fill="#f4fbff" font-family="Arial,sans-serif" font-size="58" font-weight="800">HOMEGUARD AI NOMAD</text>
<text x="76" y="190" fill="#78eaff" font-family="Arial,sans-serif" font-size="25" letter-spacing="2">QUADRUPED AI ROBOT DOG  •  OUTDOOR COMPANION</text>
<!-- floor shadow -->
<ellipse cx="690" cy="680" rx="480" ry="55" fill="#020a13" opacity=".55"/>
<!-- rear legs -->
<g stroke="#789bb5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
 <path d="M470 510L410 620L430 735"/><path d="M555 525L535 630L565 735"/>
 <path d="M900 510L960 620L935 735"/><path d="M1000 500L1060 610L1040 735"/>
</g>
<g fill="#0b1b2b" stroke="#4f7897" stroke-width="7">
 <circle cx="410" cy="620" r="28"/><circle cx="535" cy="630" r="28"/><circle cx="960" cy="620" r="28"/><circle cx="1060" cy="610" r="28"/>
 <path d="M397 735h68q18 0 18 17v12h-100v-12q0-17 14-17z"/><path d="M532 735h66q18 0 18 17v12H516v-12q0-17 16-17z"/><path d="M903 735h67q18 0 18 17v12H889v-12q0-17 14-17z"/><path d="M1008 735h67q18 0 18 17v12H994v-12q0-17 14-17z"/>
</g>
<!-- body -->
<path d="M390 380Q420 300 535 290L900 290Q1010 305 1050 390L1015 535Q990 585 910 590H505Q420 580 390 510Z" fill="url(#shell)" stroke="#83a9c3" stroke-width="7"/>
<path d="M450 390Q480 335 555 330H895Q960 340 990 400L975 490Q960 530 900 540H520Q465 530 445 480Z" fill="#0b2036" stroke="url(#cyan)" stroke-width="5"/>
<path d="M530 355H905" stroke="#4d718e" stroke-width="4"/>
<path d="M540 510H900" stroke="#1b4e70" stroke-width="5"/>
<path d="M610 425H835" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
<text x="720" y="475" text-anchor="middle" fill="#f3fbff" font-family="Arial,sans-serif" font-size="43" font-weight="800" letter-spacing="7">PUI89</text>
<!-- shoulder joints -->
<g fill="#102b43" stroke="#83eaff" stroke-width="5"><circle cx="465" cy="510" r="34"/><circle cx="555" cy="525" r="34"/><circle cx="910" cy="520" r="34"/><circle cx="1000" cy="500" r="34"/></g>
<!-- front legs -->
<g stroke="#789bb5" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none">
