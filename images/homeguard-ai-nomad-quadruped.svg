 <path d="M910 520L880 625L870 735"/><path d="M1000 500L1110 600L1120 735"/>
</g>
<g fill="#0b1b2b" stroke="#4f7897" stroke-width="7">
 <circle cx="350" cy="600" r="29"/><circle cx="500" cy="630" r="29"/><circle cx="880" cy="625" r="29"/><circle cx="1110" cy="600" r="29"/>
 <path d="M298 735h67q18 0 18 17v12H284v-12q0-17 14-17z"/><path d="M473 735h66q18 0 18 17v12H457v-12q0-17 16-17z"/><path d="M838 735h67q18 0 18 17v12H824v-12q0-17 14-17z"/><path d="M1088 735h67q18 0 18 17v12h-100v-12q0-17 14-17z"/>
