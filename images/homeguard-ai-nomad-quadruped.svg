<g filter="url(#glow)"><circle cx="1130" cy="260" r="16" fill="#8cfaff"/><circle cx="1210" cy="248" r="16" fill="#8cfaff"/></g>
<path d="M1170 220V185" stroke="#7eeeff" stroke-width="8" stroke-linecap="round"/><rect x="1142" y="155" width="58" height="36" rx="12" fill="#153d5c" stroke="#7eeeff" stroke-width="4"/>
<path d="M1065 325L1035 350" stroke="#5c829e" stroke-width="9" stroke-linecap="round"/>
<!-- sensor callouts -->
<g font-family="Arial,sans-serif">
 <path d="M1185 190L1240 120H1320" stroke="#54e6fa" stroke-width="3" fill="none"/><text x="1315" y="105" text-anchor="end" fill="#a7f5ff" font-size="18" font-weight="700">360° AWARENESS*</text>
 <path d="M720 360L720 260L600 260" stroke="#54e6fa" stroke-width="3" fill="none"/><text x="590" y="250" text-anchor="end" fill="#a7f5ff" font-size="18" font-weight="700">PROTECTED CORE</text>
 <path d="M330 625L190 560H85" stroke="#54e6fa" stroke-width="3" fill="none"/><text x="85" y="540" fill="#a7f5ff" font-size="18" font-weight="700">ARTICULATED LEGS</text>
</g>
<rect x="72" y="790" width="1256" height="66" rx="18" fill="#0b2238" stroke="#245779" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#d9f6ff" font-size="18">
 <text x="100" y="830">4-LEG QUADRUPED</text><text x="390" y="830">8–10 kg TARGET</text><text x="650" y="830">12 kg MAX TARGET</text><text x="970" y="830">WEATHER-RESISTANT GOAL*</text>
</g>
<text x="72" y="882" fill="#9cb9ce" font-family="Arial,sans-serif" font-size="15">*Proposed design features only. Sensors, 360° coverage, weather protection and mobility are not yet implemented or validated.</text>
</svg>