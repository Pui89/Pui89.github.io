name: PUI89 Combined Quality Report

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
  push:
    paths:
      - ".github/workflows/pui89-combined-quality-report.yml"
      - "PUI89_QUALITY_DASHBOARD.md"
      - "PUI89_ENGINEERING_CHARTER.md"
      - "PUI89_FIRST_TEST_RESULTS.md"
      - "PUI89_FAILURE_REPORT_STANDARD.md"
      - "schemas/pui89-failure-report.schema.json"
      - "tools/pui89_report.py"
      - "tools/pui89_level13_portfolio_smoke.py"
      - "tests/test_pui89_report.py"

permissions:
  contents: read

concurrency:
  group: pui89-combined-quality-report
  cancel-in-progress: true

jobs:
  combined-tests:
    name: Run selected suites across six active products
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out portfolio repository
        uses: actions/checkout@v4
        with:
          path: portfolio

      - name: Check out Coconut Harvest AI
        uses: actions/checkout@v4
        with:
          repository: Pui89/Coconut-Harvest-AI
          ref: main
          path: portfolio/projects/coconut

      - name: Check out PUI89 Sentinel — All-Terrain Exploration & Inspection Robot
        uses: actions/checkout@v4
        with:
          repository: Pui89/PUI89-All-Terrain-Inspection-Robot
          ref: main
          path: portfolio/projects/sentinel

      - name: Check out PUI89 AI HOME
        uses: actions/checkout@v4
        with:
          repository: Pui89/AI-Home-Safety-Robot
          ref: main
          path: portfolio/projects/home

      - name: Check out PUI89 AI NOMAD
        uses: actions/checkout@v4
        with:
          repository: Pui89/AI-Mobile-Assistant-Robot
          ref: main
          path: portfolio/projects/nomad

      - name: Check out PUI89 AI Global SUV
        uses: actions/checkout@v4
        with:
          repository: Pui89/PUI89-AI-Global-SUV
          ref: main
          path: portfolio/projects/suv

      - name: Check out PUI89 AI Step-Through Scooter
        uses: actions/checkout@v4
        with:
          repository: Pui89/AI-Step-Through-Scooter
          ref: main
          path: portfolio/projects/scooter

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate shared PUI89 report generator and contract
        working-directory: portfolio
        run: python -m unittest discover -s tests -p "test_pui89_report.py" -v

      - name: Run selected dependency-free suites across six active products
        working-directory: portfolio
        run: python tools/pui89_level13_portfolio_smoke.py

      - name: Test Coconut detection evaluation metric implementation
        if: always()
        working-directory: portfolio/projects/coconut
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_evaluate_coconut_detections.py" -v 2>&1 | tee ../../pui89-coconut-baseline-evaluator-tests.txt

      - name: Test Coconut dataset preflight validator
        if: always()
        working-directory: portfolio/projects/coconut
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_validate_coconut_dataset_manifest.py" -v 2>&1 | tee ../../pui89-coconut-dataset-preflight-tests.txt

      - name: Upload combined quality report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pui89-combined-quality-report
          path: |
            portfolio/reports/level13/pui89-level13-portfolio-report.json
            portfolio/reports/level13/pui89-level13-portfolio-report.md
            portfolio/reports/level13/logs/*.txt
            portfolio/pui89-coconut-baseline-evaluator-tests.txt
            portfolio/pui89-coconut-dataset-preflight-tests.txt
          if-no-files-found: warn
          retention-days: 14
