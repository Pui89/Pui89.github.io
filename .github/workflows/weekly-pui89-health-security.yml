name: PUI89 Weekly Health and Security Report

on:
  schedule:
    - cron: "0 10 * * 0" # Sunday 17:00 Asia/Bangkok
  workflow_dispatch:

# Deny all token permissions by default. Jobs opt into only what they need.
permissions: {}

concurrency:
  group: pui89-weekly-health-security
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out website repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate portfolio health report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pui89_weekly_health_report.py
      - name: Upload report for the publication job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: weekly-health-security-report
          path: |
            reports/weekly-health-security-latest.md
            reports/weekly-health-security-latest.json
          if-no-files-found: error
          retention-days: 1

  publish-review-pr:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out website repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download generated report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: weekly-health-security-report
          path: reports
      - name: Open or update review pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: automation/weekly-health-security-report
          delete-branch: false
          commit-message: "chore: update weekly PUI89 health and security report"
          title: "Weekly PUI89 health and security report"
          body: |
            Automated, read-only portfolio health and security snapshot.
            Review findings and evidence before merging. No project repositories or settings are modified.
          add-paths: |
            reports/weekly-health-security-latest.md
            reports/weekly-health-security-latest.json
