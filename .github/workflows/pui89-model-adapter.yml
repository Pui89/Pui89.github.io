name: PUI89 Model Adapter — Offline Contract Checks

on:
  push:
    paths:
      - "tools/pui89_model_adapter.py"
      - "tools/pui89_agent_contract.py"
      - "tools/pui89_adaptive_orchestrator.py"
      - "tests/test_pui89_model_adapter.py"
      - ".github/workflows/pui89-model-adapter.yml"
  pull_request:
    paths:
      - "tools/pui89_model_adapter.py"
      - "tools/pui89_agent_contract.py"
      - "tools/pui89_adaptive_orchestrator.py"
      - "tests/test_pui89_model_adapter.py"
      - ".github/workflows/pui89-model-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pui89-model-adapter-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  mock-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run mock adapter regression tests
        env:
          PYTHONPATH: tools
        run: python -m unittest discover -s tests -p "test_pui89_model_adapter.py" -v
