name: PUI89 world-state contract

on:
  push:
    paths:
      - "tools/pui89_world_state.py"
      - "tests/test_pui89_world_state.py"
      - "schemas/pui89-world-state-observation.schema.json"
      - ".github/workflows/pui89-world-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run world-state contract tests
        env:
          PYTHONPATH: tools
        run: python -m unittest discover -s tests -p "test_pui89_world_state.py" -v
