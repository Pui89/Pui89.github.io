name: Deploy static portfolio to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "29 5 * * 0" # Weekly Sunday validation; UTC

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required portfolio pages and seven project lines
        run: |
          test -s index.html
          test -s th.html
          grep -q '<html lang="en"' index.html
          grep -q '<html lang="th"' th.html
          grep -q 'PUI89 AI Robotics' th.html
          test -s README.md
          for page in coconut.html flood-rescue.html screening.html home.html nomad.html ai-robot-car.html ai-robot-motorcycle.html; do
            grep -Fq "href=\"$page\"" index.html || { echo "Missing project landing-page link on English homepage: $page"; exit 1; }
            grep -Fq "href=\"$page\"" th.html || { echo "Missing project landing-page link on Thai homepage: $page"; exit 1; }
          done

      - name: Run all-page local, sitemap, image, QR-asset and accessibility-source checks
        run: python3 scripts/check_site.py

      - name: Check every unique external HTTP(S) link
        run: python3 scripts/check_site.py --external

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
