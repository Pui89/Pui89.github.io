name: Deploy static portfolio to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Daily metrics refresh and site deployment; UTC

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Refresh PUI89 project metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_project_metrics.py

      - name: Validate static site files
        run: |
          test -s index.html
          test -s th.html
          grep -q '<html lang="en"' index.html
          grep -q '<html lang="th"' th.html
          grep -q 'PUI89 AI Robotics' th.html
          test -s README.md
          grep -q 'Coconut Harvest AI' index.html
          grep -q 'Flood Rescue AI' index.html
          grep -q 'Multimodal Screening AI' index.html
          grep -q 'Development stage' index.html

      - name: Check local portfolio links and required content
        run: python3 scripts/check_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
