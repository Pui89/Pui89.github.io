name: PUI89 Portfolio Quality Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.html"
      - "**/README*"
      - "README*"
      - "sitemap.xml"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: pui89-portfolio-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portfolio-audit:
    name: Portfolio consistency and website QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit portfolio consistency
        run: python scripts/portfolio_audit.py

      - name: Audit website structure, links and assets
        run: python scripts/check_site.py

      - name: Upload machine-readable website QA report
        if: always() && hashFiles('${{ runner.temp }}/pui89-site-qa-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pui89-site-qa-report
          path: ${{ runner.temp }}/pui89-site-qa-report.json
          if-no-files-found: ignore
          retention-days: 14
