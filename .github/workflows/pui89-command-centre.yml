name: PUI89 cross-project command centre

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
  push:
    paths:
      - "tools/pui89_command_centre.py"
      - "tests/test_pui89_command_centre_evidence.py"
      - ".github/workflows/pui89-command-centre.yml"

permissions:
  contents: write

concurrency:
  group: pui89-command-centre
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate read-only project status report
        run: python tools/pui89_command_centre.py
      - name: Publish report with safe retry for concurrent commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/pui89-report
          cp reports/pui89-command-centre.md reports/pui89-command-centre.json /tmp/pui89-report/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/pui89-report/pui89-command-centre.md reports/pui89-command-centre.md
            cp /tmp/pui89-report/pui89-command-centre.json reports/pui89-command-centre.json
            git add reports/pui89-command-centre.md reports/pui89-command-centre.json
            if git diff --cached --quiet; then
              echo "Command-centre report unchanged."
              exit 0
            fi
            git commit -m "Update PUI89 cross-project command centre"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying with latest main (attempt $attempt/3)."
          done
          echo "Could not publish after 3 attempts; generated reports remain available in the job workspace." >&2
          exit 1
