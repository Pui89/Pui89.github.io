name: PUI89 cross-project command centre

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
  push:
    paths:
      - "tools/pui89_command_centre.py"
      - ".github/workflows/pui89-command-centre.yml"

permissions:
  contents: write

concurrency:
  group: pui89-command-centre
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
      - name: Generate read-only project status report
        run: python tools/pui89_command_centre.py
      - name: Publish report update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/pui89-command-centre.md reports/pui89-command-centre.json
          if git diff --cached --quiet; then
            echo "Command-centre report unchanged."
          else
            git commit -m "Update PUI89 cross-project command centre"
            git push
          fi
