name: PUI89 Adaptive Agent Orchestrator
on:
  push:
    paths:
      - "tools/pui89_agent_contract.py"
      - "tools/pui89_adaptive_orchestrator.py"
      - "tests/test_pui89_adaptive_orchestrator.py"
      - ".github/workflows/pui89-adaptive-orchestrator.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run policy tests
        run: PYTHONPATH=tools python -m unittest discover -s tests -p "test_pui89_adaptive_orchestrator.py" -v
